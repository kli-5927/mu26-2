      };

      // 로그인 중인 학생의 계정이 서버에 아직 있는지 확인. 없으면 로그아웃하고 기기 속 사본 삭제
      const verifyStudentStillExists = async function(user) {
        if (!cloudReady() || !user || user.role !== 'student') return true;
        try {
          const res = await cloudGetAccount(user.id);
          if (res.error) { if (isNetworkFailure(res)) markOffline(); return true; }
          if (res.data) {
            const local = getStudentAccounts()[user.id];
            if (getPendingSync().indexOf(String(user.id)) !== -1 && local && local.pw !== res.data.pw) {
              updateCurrentUserSession(null);
              showToast('서버에 같은 학번의 계정이 있어요. 원래 비밀번호로 다시 로그인하면 이 기기에 쓴 기록이 전달됩니다.', 7000);
              return false;
            }
            pushPendingForStudent(user.id);
            return true;
          }
          if (await migrateLegacyAccount(user.id)) {
            pushPendingForStudent(user.id);
            return true;
          }
        } catch (err) {
          if (isNetworkFailure(err)) markOffline();
          return true;
        }
        purgeLocalStudent(user.id);
        updateCurrentUserSession(null);
        showToast('삭제되었거나 변경된 계정입니다. 선생님께 문의하세요.');
        return false;
      };

      const registerOnThisDevice = function(id, name, pw, reason) {
        if (getStudentAccounts()[id]) { showToast('이 기기에 이미 등록된 학번입니다. [로그인]으로 들어가 주세요.'); return; }
        cacheLocalAccount(id, name, pw);
        const offSub = loadLocalSubmissions()[id] || { studentId: id, studentName: name, classNo: Number(registerClass) || undefined, groupNo: Number(registerGroup) || undefined, reports: {} };
        putLocalSub(id, offSub);
        addPendingSync(id);
        formDirtyRef.current = false;
        updateCurrentUserSession({ role: 'student', id: id, name: name });
        setIsRegisterMode(false);
        showToast((reason ? reason + ' ' : '') + name + ' 님, 이 기기에 등록했습니다. 같은 기기에서 이어서 작성하세요. 서버가 돌아오면 자동으로 전달됩니다.', 6000);
      };

      const loginOnThisDevice = function(id, pw, reason) {
        const localAcc = getStudentAccounts()[id];
        if (!localAcc) {
          showToast((reason ? reason + ' ' : '') + '이 기기에는 아직 계정이 없어요. [최초 등록하기]로 이 기기에 등록해 주세요.', 6000);
          return;
        }
        if (localAcc.pw !== pw) { showToast('비밀번호가 일치하지 않습니다.'); return; }
        formDirtyRef.current = false;
        updateCurrentUserSession({ role: 'student', id: id, name: localAcc.name });
        showToast((reason ? reason + ' ' : '') + localAcc.name + ' 님, 환영합니다! (오프라인: 이 기기에 저장됩니다)', 5000);
      };

      const OFFLINE_SWITCH_NOTE = '서버 응답이 없어 오프라인으로 전환했어요.';
      const ID_RULE = /^\d{4,5}$/;

      const handleStudentRegister = async function(ev) {
        ev.preventDefault();
        const id = studentIdInput.trim();
        const name = studentNameInput.trim();
        const pw = studentPwInput;
        if (!ID_RULE.test(id)) { showToast('학번은 숫자 4~5자리로 입력해 주세요.'); return; }
        if (!name) { showToast('성명을 입력해 주세요.'); return; }
        if (!/^\d{4}$/.test(pw)) { showToast('비밀번호는 4자리 숫자여야 합니다.'); return; }
        const regClass = Number(registerClass) || null;
        const regGroup = Number(registerGroup) || null;
        if (!regClass) { showToast('내 반을 골라 주세요. (한 번 정하면 바꿀 수 없어요)'); return; }
        if (!regGroup) { showToast('내 조를 골라 주세요. 몇 조인지 모르면 아래 모둠 목록에서 공연 제목과 조원 이름을 보고 찾으세요.', 5000); return; }
        if (!window.confirm(name + ' 학생, 2학년 ' + regClass + '반 ' + regGroup + '조가 맞나요?\n등록한 뒤에는 반과 조를 바꿀 수 없어요. (잘못 고르면 선생님께 말씀드려야 해요)')) return;

        if (!cloudReady()) { registerOnThisDevice(id, name, pw); return; }
        if (authBusy) return;

        setAuthBusy(true);
        let goOffline = false;
        try {
          const accRes = await cloudGetAccount(id);
          if (accRes.error) {
            if (isNetworkFailure(accRes)) { goOffline = true; } else { showAccountError(accRes.error); return; }
          } else {
            if (accRes.data) { showToast('이미 등록된 학번입니다. [로그인]으로 들어가 주세요.'); return; }
            const subRes = await withTimeout(supabaseClient.from('submissions').select('student_id').eq('student_id', String(id)).maybeSingle(), SERVER_CHECK_MS);
            if (isNetworkFailure(subRes)) {
              goOffline = true;
            } else if (subRes.data) {
              showToast('이미 기록이 있는 학번입니다. 처음 가입한 기기에서 로그인하거나 선생님께 문의하세요.');
              return;
            } else {
              const ins = await withTimeout(supabaseClient.from('students').insert({ student_id: String(id), name: name, pw: pw }), SERVER_CHECK_MS);
              if (ins.error) {
                if (isNetworkFailure(ins)) { goOffline = true; } else { showAccountError(ins.error); return; }
              }
            }
          }
        } catch (err) {
          if (isNetworkFailure(err)) { goOffline = true; } else { showAccountError(err); return; }
        } finally {
          setAuthBusy(false);
        }

        if (goOffline) {
          markOffline();
          registerOnThisDevice(id, name, pw, OFFLINE_SWITCH_NOTE);
          return;
        }

        purgeLocalStudent(id);
        const initSub = { studentId: id, studentName: name, classNo: regClass, groupNo: regGroup, reports: {} };
        putLocalSub(id, initSub);
        syncStudentToCloud(id, initSub);
        cacheLocalAccount(id, name, pw);
        formDirtyRef.current = false;
        updateCurrentUserSession({ role: 'student', id: id, name: name });
        setIsRegisterMode(false);
        setMainTab('activity');
        fetchGroupInfo({ role: 'student', id: id }, regClass);
        fetchMyGroupScores(regClass, regGroup);
        showToast(name + ' 님, 등록 및 로그인 완료! (' + regClass + '반 ' + regGroup + '조) ☁️', 4000);
      };

      const handleStudentLogin = async function(ev) {
        ev.preventDefault();
        const id = studentIdInput.trim();
        const pw = studentPwInput;

        if (!cloudReady()) { loginOnThisDevice(id, pw); return; }
        if (authBusy) return;
        let acc = null;
        let goOffline = false;
        setAuthBusy(true);
        try {
          const res = await cloudGetAccount(id);
          if (res.error) {
            if (isNetworkFailure(res)) { goOffline = true; } else { showAccountError(res.error); return; }
          } else {
            acc = res.data;
            if (!acc) {
              const local = getStudentAccounts()[id];
              if (local && local.pw === pw) acc = await migrateLegacyAccount(id);
            }
          }
        } catch (err) {
          if (isNetworkFailure(err)) { goOffline = true; } else { showAccountError(err); return; }
        } finally {
          setAuthBusy(false);
        }

        if (goOffline) {
          markOffline();
          loginOnThisDevice(id, pw, OFFLINE_SWITCH_NOTE);
          return;
        }

        if (!acc) {
          purgeLocalStudent(id);
          showToast('등록되지 않은 학번입니다. [최초 등록하기]를 눌러주세요.');
          return;
        }
        if (acc.pw !== pw) { showToast('비밀번호가 일치하지 않습니다.'); return; }
        const loggedUser = { role: 'student', id: String(acc.student_id), name: acc.name };
        cacheLocalAccount(loggedUser.id, acc.name, acc.pw);
        formDirtyRef.current = false;
        updateCurrentUserSession(loggedUser);
        setMainTab('activity');
        showToast(acc.name + ' 님, 환영합니다!');
        finalPopupPendingRef.current = true;
        setStudentCloudLoaded(0);
        await pushPendingForStudent(loggedUser.id);
        fetchSubmissionsFromCloud(loggedUser);
      };

      // =========================================================
      // [교사 로그인] 서버(teacher_login 함수)에서 확인
      // =========================================================
      const isMissingFunction = function(err) {
        if (!err) return false;
        return err.code === 'PGRST202' || err.code === '42883' || /Could not find the function|does not exist/i.test(String(err.message || ''));
      };

      const finishTeacherLogin = function(id) {
        const tUser = { role: 'teacher', id: id, name: '음악 교사' };
        updateCurrentUserSession(tUser);
        setShowTeacherModal(false);
        setTeacherIdInput('');
        setTeacherPwInput('');
        setNewTeacherId(id);
        setMainTab('teacher_dash');
        setTeacherSubTab('submissions');
        fetchSubmissionsFromCloud(tUser);
        showToast('교사 관리자 모드로 접속했습니다. 🛡️');
      };

      const localTeacherLogin = function(id, pw, allowDefault, note) {
        let saved = null;
        try { const s0 = localStorage.getItem('perf_teacher_auth'); saved = s0 ? JSON.parse(s0) : null; } catch (err) { saved = null; }
        const auth = saved || (allowDefault ? { id: 'klidaum', pw: '123456' } : null);
        if (auth && id === auth.id && pw === auth.pw) {
          finishTeacherLogin(id);
          if (note) showToast(note, 6000);
          return;
        }
        showToast(auth ? '아이디 또는 6자리 비밀번호가 일치하지 않습니다.' : '서버 응답이 없어 지금은 이 컴퓨터에서 교사 로그인을 확인할 수 없습니다. 잠시 후 다시 시도해 주세요.', 6000);
      };

      const handleTeacherLogin = async function(ev) {
        ev.preventDefault();
        const id = teacherIdInput.trim();
        const pw = teacherPwInput;
        if (!cloudReady()) { localTeacherLogin(id, pw, false, '서버 응답이 없어 이 컴퓨터에 저장된 계정으로 접속했습니다.'); return; }
        if (authBusy) return;
        setAuthBusy(true);
        let result = null, err = null;
        try {
          const res = await withTimeout(supabaseClient.rpc('teacher_login', { p_id: id, p_pw: pw }), SERVER_CHECK_MS);
          if (res.error) err = res.error; else result = res.data;
        } catch (e2) {
          err = e2;
        } finally {
          setAuthBusy(false);
        }

        if (err) {
          if (isNetworkFailure(err) || (err && err.message === 'TIMEOUT')) {
            markOffline();
            localTeacherLogin(id, pw, false, '서버 응답이 없어 이 컴퓨터에 저장된 계정으로 접속했습니다.');
          } else if (isMissingFunction(err)) {
            localTeacherLogin(id, pw, true, '아직 서버에 교사 계정이 설정되지 않아 이 컴퓨터의 계정으로 접속했습니다. 안내된 SQL을 실행해 주세요.');
          } else {
            showAccountError(err);
          }
          return;
        }
        if (result === 'ok') { finishTeacherLogin(id); return; }
        if (result === 'locked') { showToast('비밀번호를 10번 틀려 10분 동안 교사 로그인이 잠겼습니다. 잠시 후 다시 시도해 주세요.', 7000); return; }
        if (result === 'no_account') { localTeacherLogin(id, pw, true, '서버에 교사 계정이 없어 이 컴퓨터의 계정으로 접속했습니다. 안내된 SQL을 실행해 주세요.'); return; }
        showToast('아이디 또는 6자리 비밀번호가 일치하지 않습니다.');
      };

      const handleLogout = function() {
        updateCurrentUserSession(null);
        formDirtyRef.current = false;
        setMainTab('activity');
        setGradingStudentId(null);
        showToast('로그아웃되었습니다.');
      };

      // [교사] 제출 마감 설정 (action: 'set_deadline' | 'clear_deadline' | 'close_now' | 'reopen')
      const setPortalByTeacher = async function(action) {
        if (deadlineBusy) return;
        if (!/^\d{6}$/.test(deadlinePw)) { showToast('확인을 위해 교사 비밀번호 6자리를 입력해 주세요.'); return; }
        let iso = null;
        if (action === 'set_deadline') {
          if (!deadlineInput) { showToast('마감 날짜와 시간을 선택해 주세요.'); return; }
          const d = new Date(deadlineInput);
          if (isNaN(d.getTime())) { showToast('마감 날짜와 시간을 다시 선택해 주세요.'); return; }
          iso = d.toISOString();
        }
        if (action === 'close_now' && !window.confirm('지금 바로 마감할까요? 학생들은 즉시 작성·수정·제출을 할 수 없게 됩니다.')) return;
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        setDeadlineBusy(true);
        try {
          const res = await withTimeout(supabaseClient.rpc('teacher_set_portal', {
            p_id: (currentUser && currentUser.id) || '', p_pw: deadlinePw,
            p_action: action === 'clear_deadline' ? 'set_deadline' : action,
            p_deadline: iso
          }), SERVER_CHECK_MS);
          if (res.error) {
            if (isNetworkFailure(res)) { markOffline(); showToast(SERVER_DOWN_MSG, 6000); return; }
            if (isMissingFunction(res.error)) {
              showToast('서버에 마감 기능이 아직 설정되지 않았습니다. 통합 SQL을 먼저 실행해 주세요.', 7000);
              return;
            }
            showAccountError(res.error);
            return;
          }
          if (res.data === 'ok') {
            await refreshPortalStatus();
            setDeadlinePw('');
            const msg = action === 'set_deadline' ? '자동 마감 시각을 ' + formatDeadline(iso) + '(으)로 저장했습니다. ⏰'
              : action === 'clear_deadline' ? '자동 마감 시각을 지웠습니다.'
              : action === 'close_now' ? '지금 바로 마감했습니다. 학생들은 더 이상 작성·제출할 수 없습니다. 🔒'
              : '제출을 다시 열었습니다. (자동 마감 시각도 지워졌어요) 🔓';
            showToast(msg, 6000);
          } else if (res.data === 'locked') {
            showToast('비밀번호를 여러 번 틀려 10분 동안 잠겼습니다. 잠시 후 다시 시도해 주세요.', 6000);
          } else {
            showToast('교사 비밀번호가 맞지 않습니다.');
          }
        } catch (err) {
          if (isNetworkFailure(err)) markOffline();
          showToast(SERVER_DOWN_MSG, 6000);
        } finally {
          setDeadlineBusy(false);
        }
      };

      const handleSaveTeacherAuth = async function(ev) {
        ev.preventDefault();
        const newId = newTeacherId.trim();
        if (!newId) { showToast('교사 아이디를 입력해 주세요.'); return; }
        if (!/^\d{6}$/.test(newTeacherPw)) { showToast('새 비밀번호는 반드시 6자리 숫자여야 합니다.'); return; }
        if (!currentTeacherPw) { showToast('지금 쓰고 있는 비밀번호를 입력해 주세요.'); return; }
        const oldId = (currentUser && currentUser.id) || teacherAuth.id;

        const saveLocal = function() {
          const updated = { id: newId, pw: newTeacherPw };
          setTeacherAuth(updated);
          safeSetLocal('perf_teacher_auth', JSON.stringify(updated));
          updateCurrentUserSession({ role: 'teacher', id: newId, name: '음악 교사' });
          setNewTeacherPw('');
          setCurrentTeacherPw('');
        };

        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        try {
          const res = await withTimeout(supabaseClient.rpc('teacher_change_auth', { p_old_id: oldId, p_old_pw: currentTeacherPw, p_new_id: newId, p_new_pw: newTeacherPw }), SERVER_CHECK_MS);
          if (res.error) {
            if (isMissingFunction(res.error)) {
              if (currentTeacherPw !== teacherAuth.pw) { showToast('지금 쓰고 있는 비밀번호가 맞지 않습니다.'); return; }
              saveLocal();
              showToast('이 컴퓨터에만 저장했습니다. 다른 컴퓨터에서도 쓰려면 안내된 SQL을 먼저 실행해 주세요.', 6000);
              return;
            }
            if (isNetworkFailure(res)) { markOffline(); showToast(SERVER_DOWN_MSG, 6000); return; }
            showAccountError(res.error);
            return;
          }
          if (res.data === 'ok') {
            saveLocal();
            showToast('교사 아이디와 비밀번호가 서버에 저장되었습니다. 이제 어느 컴퓨터에서든 새 정보로 로그인하세요. 🔒', 6000);
          } else if (res.data === 'locked') {
            showToast('비밀번호를 여러 번 틀려 10분 동안 잠겼습니다. 잠시 후 다시 시도해 주세요.', 6000);
          } else {
            showToast('지금 쓰고 있는 비밀번호가 맞지 않습니다.');
          }
        } catch (err) {
          if (isNetworkFailure(err)) markOffline();
          showToast(SERVER_DOWN_MSG, 6000);
        }
      };

      // [학생] 저장 직전 확인: 마감이면 'deadline', 점수가 확정됐으면 'confirmed', 아니면 null
      const studentEditBlocked = async function() {
        if (!currentUser || currentUser.role !== 'student') return null;
        if (isPortalClosedNow()) return 'deadline';
        if (getConfirmed(allSubmissions[currentUser.id])) return 'confirmed';
        if (cloudReady()) {
          const np = await refreshPortalStatus();
          if (np && isPortalClosedNow(np)) return 'deadline';
          const g = await checkMyGrading(currentUser);
          if (g && g.confirmed) return 'confirmed';
        }
        return null;
      };

      // =========================================================
      // [학생] 작성 양식
      // =========================================================
      const myId = currentUser && currentUser.role === 'student' ? currentUser.id : null;
      const mySub = myId ? allSubmissions[myId] : null;
      const myAct = mySub && mySub.reports && mySub.reports.act;
      const formSyncKey = myId ? [myId, mySub ? (mySub.classNo || '') + '-' + (mySub.groupNo || '') : '', myAct ? myAct.updatedAt + ':' + (myAct.isSubmitted ? 1 : 0) : 'none'].join('|') : '';
      useEffect(function() {
        if (!myId) return;
        if (formDirtyRef.current) return;
        const base = Object.assign(emptyAct(), JSON.parse(JSON.stringify(myAct || {})));
        base.roles = Object.assign({ lead: false, cuesheet: false, editor: false }, base.roles || {});
        base.roleDetails = Object.assign({ lead: '', cuesheet: '', editor: '' }, base.roleDetails || {});
        base.perfTypes = (base.perfTypes || []).slice();
        base.perfDetails = base.perfDetails || {};
        base.peerChecks = base.peerChecks || {};
        base.evals = base.evals || {};
        setActForm(Object.assign(base, {
          classNo: (mySub && mySub.classNo) || guessClassFromId(myId) || '',
          groupNo: (mySub && mySub.groupNo) || ''
        }));
      }, [formSyncKey]);

      const updateForm = function(patch) {
        formDirtyRef.current = true;
        setActForm(function(prev) { return Object.assign({}, prev, patch); });
      };
      const updateEval = function(g, patch) {
        formDirtyRef.current = true;
        setActForm(function(prev) {
          const evs = Object.assign({}, prev.evals || {});
          evs[String(g)] = Object.assign({ stars: 0 }, evs[String(g)] || {}, patch);
          return Object.assign({}, prev, { evals: evs });
        });
      };
      // 1번: 역할별 활동 내용
      const updateRoleDetail = function(key, v) {
        formDirtyRef.current = true;
        setActForm(function(prev) {
          const d = Object.assign({}, prev.roleDetails || {}); d[key] = v;
          return Object.assign({}, prev, { roleDetails: d });
        });
      };
      // 2번: 공연 형태 여러 개 고르기 (다시 누르면 해제, 쓴 내용은 남겨 둠)
      const togglePerfType = function(t) {
        formDirtyRef.current = true;
        setActForm(function(prev) {
          const list = (prev.perfTypes || []).slice();
          const i = list.indexOf(t);
          if (i === -1) list.push(t); else list.splice(i, 1);
          list.sort(function(a, b) { return PERF_TYPES.indexOf(a) - PERF_TYPES.indexOf(b); });
          return Object.assign({}, prev, { perfTypes: list });
        });
      };
      const updatePerfDetail = function(t, patch) {
        formDirtyRef.current = true;
        setActForm(function(prev) {
          const d = Object.assign({}, prev.perfDetails || {});
          d[t] = Object.assign({ what: '', process: '' }, d[t] || {}, patch);
          return Object.assign({}, prev, { perfDetails: d });
        });
      };
      // 3번: 모둠원 체크 (체크 해제하면 이유도 지움)
      const togglePeer = function(name) {
        formDirtyRef.current = true;
        setActForm(function(prev) {
          const pc = Object.assign({}, prev.peerChecks || {});
          if (Object.prototype.hasOwnProperty.call(pc, name)) delete pc[name]; else pc[name] = '';
          return Object.assign({}, prev, { peerChecks: pc });
        });
      };
      const updatePeerReason = function(name, v) {
        formDirtyRef.current = true;
        setActForm(function(prev) {
          const pc = Object.assign({}, prev.peerChecks || {}); pc[name] = v;
          return Object.assign({}, prev, { peerChecks: pc });
        });
      };
      // 내 조 친구 이름 (선생님이 적은 조원 이름에서 내 이름 빼기)
      const groupMateNames = function(c, g) {
        if (!c || !g) return [];
        const me = currentUser && currentUser.role === 'student' ? String(currentUser.name || '').trim() : '';
        return splitMembers((groupInfo[groupKey(c, g)] || {}).members).filter(function(n) { return n !== me; });
      };

      // 최종 제출 전에 빠진 것 찾기 (없으면 null)
      const findMissing = function(f) {
        if (!f.classNo || !f.groupNo) return '맨 위에서 내 반과 조를 먼저 골라 주세요.';
        const r = f.roles || {};
        for (let i = 0; i < ROLES.length; i++) {
          if (r[ROLES[i].key] && !tlen((f.roleDetails || {})[ROLES[i].key])) return '1번: [' + ROLES[i].label + '] 역할에서 한 활동 내용을 적어 주세요.';
        }
        if (!(f.perfTypes || []).length) return '2번: 공연 형태를 하나 이상 골라 주세요.';
        if (f.perfTypes.indexOf(PERF_ETC) !== -1 && !tlen(f.perfEtc)) return '2번: 기타 공연 형태가 무엇인지 적어 주세요.';
        const pl = perfTextLength(f);
        if (pl < PERF_MIN_LEN) return '2번: 개인 활동 내용을 모두 더해 ' + PERF_MIN_LEN + '자 이상 써 주세요. (지금 ' + pl + '자)';
        const names = Object.keys(f.peerChecks || {});
        for (let i = 0; i < names.length; i++) {
          if (!tlen(f.peerChecks[names[i]])) return '3번: ' + names[i] + ' 친구를 고른 이유를 적어 주세요. (해당 없으면 체크를 풀어 주세요)';
        }
        const others = otherGroups(f.groupNo);
        for (let i = 0; i < others.length; i++) {
          const ev = (f.evals || {})[String(others[i])] || {};
          if (!ev.stars) return '4번: ' + others[i] + '조 공연의 별점을 골라 주세요.';
          const el = evalTextLength(ev);
          if (el < EVAL_MIN_LEN) return '4번: ' + others[i] + '조 평가를 4칸 모두 더해 ' + EVAL_MIN_LEN + '자 이상 써 주세요. (지금 ' + el + '자)';
        }
        return null;
      };

      const saveAct = async function(isSubmit) {
        if (!currentUser) return;
        if (currentUser.role !== 'student') { showToast('교사 미리보기 화면에서는 저장되지 않습니다.'); return; }
        if (saveBusy) return;
        // 한 번 정해진 반·조는 학생이 바꿀 수 없음 (저장된 값을 그대로 씀)
        const saved = allSubmissions[currentUser.id] || {};
        const f = Object.assign({}, actForm, {
          classNo: saved.classNo || actForm.classNo,
          groupNo: saved.groupNo || actForm.groupNo
        });
        const firstPlace = !saved.classNo || !saved.groupNo;
        if (isSubmit) {
          const miss = findMissing(f);
          if (miss) { showToast(miss, 5000); return; }
        } else if (!f.classNo || !f.groupNo) {
          showToast('맨 위에서 내 반과 조를 먼저 골라 주세요.', 4000);
          return;
        }
        if (firstPlace && f.classNo && f.groupNo &&
            !window.confirm('2학년 ' + f.classNo + '반 ' + f.groupNo + '조가 맞나요?\n한 번 저장하면 반과 조를 바꿀 수 없어요. (잘못 골랐다면 선생님께 말씀드려야 해요)')) return;
        setSaveBusy(true);
        try {
          const blocked = await studentEditBlocked();
          if (blocked) {
            showToast(lockMessage(blocked) + ' 지금 작성한 내용은 반영되지 않습니다.', 7000);
            formDirtyRef.current = false;
            return;
          }
          const id = currentUser.id;
          const sData = allSubmissions[id] || { studentId: id, studentName: currentUser.name, reports: {} };
          const evals = {};
          otherGroups(f.groupNo).forEach(function(g) {
            const ev = (f.evals || {})[String(g)];
            if (evalHasContent(ev)) {
              const keep = { stars: ev.stars || 0 };
              EVAL_FIELDS.forEach(function(x) { keep[x.key] = ev[x.key] || ''; });
              evals[String(g)] = keep;
            }
          });
          const r = f.roles || {};
          const roleDetails = {};
          ROLES.forEach(function(x) { if (r[x.key]) roleDetails[x.key] = (f.roleDetails || {})[x.key] || ''; });
          const perfTypes = (f.perfTypes || []).slice();
          const perfDetails = {};
          perfTypes.forEach(function(t) {
            const d = (f.perfDetails || {})[t] || {};
            perfDetails[t] = { what: d.what || '', process: d.process || '' };
          });
          // 고른 조의 조원 명단에 있는 이름만 남김 (조를 바꾼 경우)
          const mates = groupMateNames(f.classNo, f.groupNo);
          const peerChecks = {};
          Object.keys(f.peerChecks || {}).forEach(function(n) {
            if (!mates.length || mates.indexOf(n) !== -1) peerChecks[n] = f.peerChecks[n] || '';
          });
          const act = {
            roles: { lead: !!r.lead, cuesheet: !!r.cuesheet, editor: !!r.editor },
            roleDetails: roleDetails,
            perfTypes: perfTypes,
            perfEtc: perfTypes.indexOf(PERF_ETC) !== -1 ? (f.perfEtc || '') : '',
            perfDetails: perfDetails,
            difficulty: f.difficulty || '',
            episode: f.episode || '',
            completion: f.completion || '',
            peerChecks: peerChecks,
            peerIssue: f.peerIssue || '',
            evals: evals,
            isSubmitted: !!isSubmit,
            updatedAt: new Date().toLocaleString('ko-KR')
          };
          const fullData = Object.assign({}, sData, {
            studentId: id, studentName: sData.studentName || currentUser.name,
            classNo: Number(f.classNo), groupNo: Number(f.groupNo),
            reports: Object.assign({}, sData.reports || {}, { act: act })
          });

          // 1) 먼저 이 기기에 저장 (서버가 느려도 학생이 기다리지 않도록)
          const upLocal = Object.assign({}, allSubmissions, { [id]: fullData });
          if (!safeSetLocal('perf_submissions', JSON.stringify(upLocal))) {
            showToast('기기 저장 공간이 부족합니다. 브라우저의 다른 사이트 데이터를 정리한 뒤 다시 저장해 주세요.', 6000);
            return;
          }
          formDirtyRef.current = false;
          setAllSubmissions(upLocal);
          addPendingSync(id);
          const offlineMsg = isSubmit
            ? '최종 제출로 이 기기에 저장했습니다. 서버가 돌아오면 선생님께 자동 전달됩니다. 📦'
            : '이 기기에 임시 저장했습니다. 서버가 돌아오면 자동으로 전달됩니다. 💾';
          if (!cloudReady()) { showToast(offlineMsg, 5000); return; }

          // 2) 서버로 전송
          showToast('이 기기에 저장했어요. 선생님께 전송하는 중…', 30000);
          const stillExists = await verifyStudentStillExists(currentUser);
          if (!stillExists) return;

          // 서버의 최신 채점 결과를 덮어쓰지 않도록 가져와 유지
          try {
            const res = await withTimeout(supabaseClient.from('submissions').select('grading:data->grading').eq('student_id', String(id)).maybeSingle(), SERVER_CHECK_MS);
            if (isNetworkFailure(res)) {
              markOffline();
            } else if (res.error) {
              const res2 = await withTimeout(supabaseClient.from('submissions').select('data').eq('student_id', String(id)).maybeSingle(), SERVER_CHECK_MS);
              if (isNetworkFailure(res2)) markOffline();
              else if (res2.data && res2.data.data && res2.data.data.grading) fullData.grading = res2.data.data.grading;
            } else if (res.data && res.data.grading) {
              fullData.grading = res.data.grading;
            } else {
              delete fullData.grading;
            }
          } catch (err) {
            if (isNetworkFailure(err)) markOffline();
          }

          const sent = await syncStudentToCloud(id, fullData);
          const why = sent ? null : lockReasonAfterFailedSync();
          if (why) {
            removePendingSync(id);
            fetchSubmissionsFromCloud({ role: 'student', id: id });
            showToast(lockMessage(why) + ' 방금 작성한 내용은 반영되지 않았습니다.', 7000);
            return;
          }
          if (sent) {
            removePendingSync(id);
            putLocalSub(id, fullData);
            if (Number(saved.classNo || 0) !== Number(fullData.classNo)) await fetchGroupInfo(currentUser, fullData.classNo);
            fetchMyGroupScores(fullData.classNo, fullData.groupNo);
            showToast(isSubmit ? '최종 제출되었습니다! 선생님 화면에 바로 보입니다. 🎉' : '임시 저장되었습니다. (클라우드 저장 완료) 💾', 4000);
          } else {
            showToast(offlineMsg, 5000);
          }
        } finally {
          setSaveBusy(false);
        }
      };

      // =========================================================
      // [교사] 채점·모둠 점수·확정
      // =========================================================
      const resetAllData = async function() {
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        const c = prompt('모든 학생 계정(학번/비밀번호), 활동 기록, 모둠 정보(공연 제목·영상 링크·모둠 점수)를 완전히 삭제하시겠습니까?\n진행하시려면 "RESET"을 입력하세요.');
        if (c !== 'RESET') return;
        let failed = false;
        try {
          const r1 = await withTimeout(supabaseClient.from('submissions').delete().neq('student_id', '_empty_'));
          const r2 = await withTimeout(supabaseClient.from('students').delete().neq('student_id', '_empty_'));
          const r3 = await withTimeout(supabaseClient.from('group_info').delete().gte('class_no', 0));
          failed = !!(r1.error || r2.error || r3.error);
        } catch (err) {
          console.error('Cloud Reset Error:', err);
          failed = true;
        }
        try {
          localStorage.removeItem('perf_submissions');
          localStorage.removeItem('perf_student_accounts');
          localStorage.removeItem('perf_group_info');
          localStorage.removeItem('perf_pending_sync');
        } catch (err) {}
        setAllSubmissions({});
        setGroupInfo({});
        groupInfoRef.current = {};
        setGroupDrafts({});
        showToast(failed ? '일부 데이터를 서버에서 지우지 못했습니다. [새로고침] 후 다시 시도해 주세요.' : '모든 데이터가 초기화되었습니다. 🔄', 5000);
        fetchSubmissionsFromCloud();
      };

      // 서버에서 한 학생 기록 읽기 (없으면 null, 연결 실패면 'offline')
      const readSubFromCloud = async function(studentId) {
        try {
          const res = await withTimeout(supabaseClient.from('submissions').select('data').eq('student_id', String(studentId)).maybeSingle(), SERVER_CHECK_MS);
          if (isNetworkFailure(res)) { markOffline(); return 'offline'; }
          if (res.error) return null;
          return (res.data && res.data.data) || null;
        } catch (err) {
          if (isNetworkFailure(err)) { markOffline(); return 'offline'; }
          return null;
        }
      };

      // 모둠 정보 저장 (patch: title, video_url, members, plan_score, perform_score 중 일부). 성공하면 저장된 행
      const lastGroupErrorRef = useRef(null);
      // 저장 실패 이유를 선생님이 알 수 있게 안내
      const groupErrorText = function() {
        const er = lastGroupErrorRef.current;
        if (!er) return '잠시 후 다시 시도해 주세요.';
        const msg = String(er.message || '');
        if (er.code === 'PGRST205' || er.code === '42P01' || /group_info/.test(msg) && /schema cache|does not exist/.test(msg)) return '서버에 모둠 정보 표(group_info)가 없습니다. 통합 SQL을 실행했는지 확인해 주세요.';
        if (er.code === '42501' || /permission denied|row-level security/i.test(msg)) return '서버에서 모둠 정보 표에 쓸 권한이 없습니다. 안내된 권한 SQL을 실행해 주세요.';
        return '(' + (er.code ? er.code + ': ' : '') + msg + ')';
      };
      const saveGroupRow = async function(c, g, patch) {
        const cur = groupInfoRef.current[groupKey(c, g)] || {};
        const row = {
          class_no: Number(c), group_no: Number(g),
          title: cur.title || '', video_url: cur.video_url || '', members: cur.members || '',
          plan_score: isNum(cur.plan_score) ? cur.plan_score : null,
          perform_score: isNum(cur.perform_score) ? cur.perform_score : null,
          updated_at: new Date().toISOString()
        };
        Object.assign(row, patch);
        const res = await withTimeout(supabaseClient.from('group_info').upsert(row, { onConflict: 'class_no,group_no' }), SERVER_CHECK_MS);
        if (res.error) {
          if (isNetworkFailure(res)) markOffline();
          lastGroupErrorRef.current = res.error;
          console.error('group_info save error:', res.error);
          return null;
        }
        lastGroupErrorRef.current = null;
        mergeGroupRows([row]);
        return row;
      };

      // 모둠 점수가 바뀌면, 확정된 조원 중 확정 점수와 달라진 학생의 확정을 풀어 줌. 풀린 학생 이름 목록
      const releaseGroupConfirmations = async function(c, g, exceptId) {
        const released = [];
        const ids = Object.keys(allSubmissions).filter(function(id) {
          const s = allSubmissions[id];
          return id !== exceptId && s && Number(s.classNo) === Number(c) && Number(s.groupNo) === Number(g) && getConfirmed(s);
        });
        for (let i = 0; i < ids.length; i++) {
          const t = await readSubFromCloud(ids[i]);
          if (!t || t === 'offline' || !getConfirmed(t)) continue;
          if (Number(t.classNo) !== Number(c) || Number(t.groupNo) !== Number(g)) continue;
          if (!snapshotDiffers(t.grading.confirmed, computeScores(t, groupInfoRef.current))) continue;
          const grading = Object.assign({}, t.grading);
          delete grading.confirmed;
          const updated = Object.assign({}, t, { grading: grading });
          if (await syncStudentToCloud(ids[i], updated)) {
            putLocalSub(ids[i], updated);
            released.push(t.studentName || ids[i]);
          }
        }
        return released;
      };

      const scoreVal = function(v) { return v === '' || v === null || v === undefined ? null : Number(v); };

      const openGrading = function(s) {
        const gi = groupInfo[groupKey(s.classNo, s.groupNo)] || {};
        const ind = (s.grading && s.grading.ind) || {};
        const v = function(x) { return isNum(x) ? String(x) : ''; };
        setGradingForm({
          plan: v(gi.plan_score), perform: v(gi.perform_score),
          participation: v(ind.participation), review: v(ind.review),
          comment: ind.comment || '', teacherFeedback: (s.grading && s.grading.teacherFeedback) || ''
        });
        setGradingStudentId(s.studentId);
      };

      const saveGrading = async function(studentId) {
        if (!studentId || gradingBusy) return;
        if (!cloudReady()) { showToast('서버 응답이 없어 채점을 저장할 수 없습니다. 창을 닫지 말고 서버가 돌아오면 다시 저장해 주세요.', 6000); return; }
        setGradingBusy(true);
        try {
          const target = await readSubFromCloud(studentId);
          if (target === 'offline') { showToast(SERVER_DOWN_MSG, 6000); return; }
          if (!target) { showToast('학생 기록을 찾지 못했습니다. [새로고침]을 누른 뒤 다시 시도해 주세요.'); return; }
          const name = target.studentName || studentId;
          const nowStr = new Date().toLocaleString('ko-KR');
          const notes = [];

          // 1) 모둠 점수 (조원 모두에게 적용)
          const c = target.classNo, g = target.groupNo;
          const plan = scoreVal(gradingForm.plan), perform = scoreVal(gradingForm.perform);
          if (c && g) {
            const gi = groupInfoRef.current[groupKey(c, g)] || {};
            const curPlan = isNum(gi.plan_score) ? gi.plan_score : null;
            const curPerform = isNum(gi.perform_score) ? gi.perform_score : null;
            if (plan !== curPlan || perform !== curPerform) {
              const row = await saveGroupRow(c, g, { plan_score: plan, perform_score: perform });
              if (!row) { showToast('모둠 점수를 저장하지 못했습니다. ' + groupErrorText(), 9000); return; }
              const members = Object.keys(allSubmissions).filter(function(id) { const s = allSubmissions[id]; return s && Number(s.classNo) === Number(c) && Number(s.groupNo) === Number(g); }).length;
              notes.push(c + '반 ' + g + '조 모둠 점수 저장 (조원 ' + Math.max(members, 1) + '명에게 적용)');
              const rel = await releaseGroupConfirmations(c, g, studentId);
              if (rel.length) notes.push('모둠 점수가 바뀌어 ' + rel.join(', ') + ' 학생의 확정이 해제됨');
            }
          }

          // 2) 개인 점수
          const prevGrading = target.grading || {};
          const act = target.reports && target.reports.act;
          const participation = scoreVal(gradingForm.participation), review = scoreVal(gradingForm.review);
          const comment = (gradingForm.comment || '').trim();
          let ind = prevGrading.ind || null;
          if (participation !== null || review !== null || comment) {
            ind = {
              participation: participation, review: review, comment: comment,
              reportVersion: act ? act.updatedAt : null,
              gradedAt: nowStr
            };
          } else {
            ind = null;
          }
          const grading = Object.assign({}, prevGrading, {
            ind: ind || undefined,
            teacherFeedback: gradingForm.teacherFeedback || '',
            gradedAt: nowStr
          });
          if (!ind) delete grading.ind;

          // 3) 확정 유지 여부: 확정 때와 점수가 달라지면 확정을 풀어 다시 확정하게 함
          let released = false;
          if (grading.confirmed) {
            const after = computeScores(Object.assign({}, target, { grading: grading }), groupInfoRef.current);
            if (snapshotDiffers(grading.confirmed, after)) { delete grading.confirmed; released = true; }
          }
          const updated = Object.assign({}, target, { grading: grading });
          const ok = await syncStudentToCloud(studentId, updated);
          if (!ok) { showToast('채점을 저장하지 못했습니다. 창을 닫지 말고 잠시 후 다시 저장해 주세요.', 6000); return; }
          putLocalSub(studentId, updated);
          setGradingStudentId(null);
          const sc = computeScores(updated, groupInfoRef.current);
          showToast(name + ' 학생 채점 저장 (총점 ' + sc.total + ' / ' + TOTAL_MAX + '점) 🌟' +
            (notes.length ? ' · ' + notes.join(' · ') : '') +
            (released ? ' · 점수가 바뀌어 이 학생의 확정이 해제되었습니다. 다시 [확정하기]를 눌러 주세요.' : ''), notes.length || released ? 8000 : 3500);
        } finally {
          setGradingBusy(false);
        }
      };

      // [교사] 점수 확정하기 / 확정 취소
      const setStudentConfirmed = async function(studentId, makeConfirmed) {
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        const target = await readSubFromCloud(studentId);
        if (target === 'offline') { showToast(SERVER_DOWN_MSG, 6000); return; }
        if (!target) { showToast('학생 기록을 찾지 못했습니다. [새로고침]을 누른 뒤 다시 시도해 주세요.'); return; }
        const name = target.studentName || studentId;
        const grading = Object.assign({}, target.grading || {});

        if (makeConfirmed) {
          if (target.classNo && target.groupNo) await fetchGroupInfo(currentUserRef.current);
          const sc = computeScores(target, groupInfoRef.current);
          if (!sc.any) { showToast('채점된 점수가 없어 확정할 수 없습니다. 먼저 채점해 주세요.', 5000); return; }
          const line = function(it) { return it.label + ': ' + (sc[it.key] === null ? '채점 전 (0점으로 확정됨)' : sc[it.key] + ' / ' + it.max); };
          const st = getActStatus(target);
          const msg = name + ' 학생의 점수를 확정할까요?\n\n' +
            SCORE_ITEMS.map(line).join('\n') + '\n합계: ' + sc.total + ' / ' + TOTAL_MAX + '점\n\n' +
            (!sc.complete ? '⚠ 아직 채점하지 않은 항목이 있어요.\n\n' : '') +
            (st.kind === 'resubmitted' ? '⚠ 학생이 채점 뒤에 활동 기록을 다시 제출했어요.\n\n' : '') +
            '확정하면 학생에게 최종 점수로 보이고, 학생은 더 이상 활동 기록을 고칠 수 없습니다.';
          if (!window.confirm(msg)) return;
          grading.confirmed = { plan: sc.plan, perform: sc.perform, participation: sc.participation, review: sc.review, total: sc.total, at: new Date().toLocaleString('ko-KR') };
        } else {
          if (!window.confirm(name + ' 학생의 점수 확정을 취소할까요?\n학생 화면의 "최종 점수" 표시가 사라지고, 마감 전이라면 학생이 다시 활동 기록을 고칠 수 있습니다.')) return;
          delete grading.confirmed;
        }

        const updated = Object.assign({}, target, { grading: grading });
        const ok = await syncStudentToCloud(studentId, updated);
        if (!ok) { showToast('저장하지 못했습니다. 잠시 후 다시 시도해 주세요.', 5000); return; }
        putLocalSub(studentId, updated);
        showToast(makeConfirmed
          ? name + ' 학생의 점수를 확정했습니다. (최종 ' + grading.confirmed.total + ' / ' + TOTAL_MAX + '점) ✅'
          : name + ' 학생의 점수 확정을 취소했습니다.', 5000);
      };

      // [교사] 모둠 관리: 공연 제목·영상 링크·조원·모둠 점수 저장
      const getGroupDraft = function(c, g) {
        const k = groupKey(c, g);
        if (groupDrafts[k]) return groupDrafts[k];
        const gi = groupInfo[k] || {};
        return {
          title: gi.title || '', video_url: gi.video_url || '', members: gi.members || '',
          plan: isNum(gi.plan_score) ? String(gi.plan_score) : '', perform: isNum(gi.perform_score) ? String(gi.perform_score) : ''
        };
      };
      const setGroupDraft = function(c, g, patch) {
        const k = groupKey(c, g);
        setGroupDrafts(function(prev) {
          return Object.assign({}, prev, { [k]: Object.assign({}, prev[k] || getGroupDraft(c, g), patch) });
        });
      };
      const saveGroupCard = async function(c, g) {
        const k = groupKey(c, g);
        if (groupBusy) return;
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        const d = getGroupDraft(c, g);
        const url = (d.video_url || '').trim();
        if (url && !/^https?:\/\//i.test(url)) { showToast('영상 링크는 https:// 로 시작하는 주소를 붙여 넣어 주세요.', 5000); return; }
        setGroupBusy(k);
        try {
          const gi = groupInfoRef.current[k] || {};
          const plan = scoreVal(d.plan), perform = scoreVal(d.perform);
          const scoreChanged = plan !== (isNum(gi.plan_score) ? gi.plan_score : null) || perform !== (isNum(gi.perform_score) ? gi.perform_score : null);
          const row = await saveGroupRow(c, g, { title: (d.title || '').trim(), video_url: url, members: (d.members || '').trim(), plan_score: plan, perform_score: perform });
          if (!row) { showToast('저장하지 못했습니다. ' + groupErrorText(), 9000); return; }
          setGroupDrafts(function(prev) { const up = Object.assign({}, prev); delete up[k]; return up; });
          let rel = [];
          if (scoreChanged) rel = await releaseGroupConfirmations(c, g, null);
          showToast(c + '반 ' + g + '조 정보를 저장했습니다.' + (rel.length ? ' 모둠 점수가 바뀌어 ' + rel.join(', ') + ' 학생의 확정이 해제되었습니다.' : ''), rel.length ? 7000 : 3000);
        } finally {
          setGroupBusy('');
        }
      };

      // [교사] 학생 정보 수정 (학번·성명·반·조)
      const saveStudentInfoEdit = async function(ev) {
        ev.preventDefault();
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        if (!editingStudentTargetId) return;
        const oldId = editingStudentTargetId;
        const newId = editingStudentForm.id.trim();
        const newName = editingStudentForm.name.trim();
        const newClass = editingStudentForm.classNo ? Number(editingStudentForm.classNo) : null;
        const newGroup = editingStudentForm.groupNo ? Number(editingStudentForm.groupNo) : null;
        if (!ID_RULE.test(newId)) { showToast('학번은 숫자 4~5자리로 입력해 주세요.'); return; }
        if (!newName) { showToast('성명을 입력해 주세요.'); return; }

        let currentPw = '0000';
        try {
          const oldAcc = await cloudGetAccount(oldId);
          if (oldAcc.error) { showAccountError(oldAcc.error); return; }
          if (oldAcc.data) currentPw = oldAcc.data.pw;
          if (oldId !== newId) {
            const dup = await cloudGetAccount(newId);
            if (dup.data || allSubmissions[newId]) { showToast('변경하려는 학번(' + newId + ')이 이미 존재합니다.'); return; }
          }
        } catch (err) {
          showAccountError(err);
          return;
        }

        const cur = await readSubFromCloud(oldId);
        if (cur === 'offline') { showToast(SERVER_DOWN_MSG, 6000); return; }
        const base = cur || allSubmissions[oldId] || { studentId: oldId, studentName: newName, reports: {} };
        const updated = Object.assign({}, base, { studentId: newId, studentName: newName });
        if (newClass) updated.classNo = newClass; else delete updated.classNo;
        if (newGroup) updated.groupNo = newGroup; else delete updated.groupNo;
        let releasedNote = '';
        if (getConfirmed(updated) && (Number(base.classNo) !== Number(updated.classNo) || Number(base.groupNo) !== Number(updated.groupNo))) {
          if (snapshotDiffers(updated.grading.confirmed, computeScores(updated, groupInfoRef.current))) {
            updated.grading = Object.assign({}, updated.grading);
            delete updated.grading.confirmed;
            releasedNote = ' 모둠이 바뀌어 모둠 점수가 달라졌으므로 확정이 해제되었습니다.';
          }
        }

        try {
          const accRes = await withTimeout(supabaseClient.from('students').upsert({ student_id: String(newId), name: newName, pw: currentPw }, { onConflict: 'student_id' }));
          if (accRes.error) { showAccountError(accRes.error); return; }
          let ok;
          if (oldId !== newId && cur) {
            // 학번 변경: 기존 줄을 새 학번으로 옮김 (활동 기록은 그대로라 마감 뒤에도 가능)
            const mv = await withTimeout(supabaseClient.from('submissions').update({ student_id: String(newId), data: updated, updated_at: new Date().toISOString() }).eq('student_id', String(oldId)));
            ok = !mv.error;
          } else {
            ok = await syncStudentToCloud(newId, updated);
          }
          if (!ok) { showToast('학생 정보를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.', 5000); return; }
          if (oldId !== newId) {
            await withTimeout(supabaseClient.from('submissions').delete().eq('student_id', String(oldId)));
            await withTimeout(supabaseClient.from('students').delete().eq('student_id', String(oldId)));
          }
        } catch (err) {
          console.error('Student Edit Cloud Error:', err);
          showToast(SERVER_DOWN_MSG, 6000);
          return;
        }

        const accs = getStudentAccounts();
        if (accs[oldId]) { delete accs[oldId]; safeSetLocal('perf_student_accounts', JSON.stringify(accs)); }
        setAllSubmissions(function(prev) {
          const up = Object.assign({}, prev);
          delete up[oldId];
          up[newId] = updated;
          safeSetLocal('perf_submissions', JSON.stringify(up));
          return up;
        });
        setEditingStudentModal(false);
        setEditingStudentTargetId(null);
        showToast(newName + ' 학생 정보가 수정되었습니다. ✏️' + releasedNote, releasedNote ? 7000 : 3000);
      };

      // [교사] 학생 한 명 기록 영구 삭제
      const deleteSingleStudent = async function() {
        if (!editingStudentTargetId) return;
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        const target = allSubmissions[editingStudentTargetId];
        const sName = (target && target.studentName) || editingStudentTargetId;
        const c = prompt(
          '정말로 ' + sName + ' (' + editingStudentTargetId + ') 학생의 모든 데이터(계정, 활동 기록, 다른 모둠 평가, 채점 내역)를 삭제하시겠습니까?\n' +
          '삭제하려면 "삭제"라고 입력하세요.'
        );
        if (c !== '삭제') { showToast('삭제가 취소되었습니다.'); return; }
        const targetId = editingStudentTargetId;
        let cloudFailed = false;
        try {
          // 기록을 먼저 지운 뒤 계정을 지움 (학생 기기에서 계정이 다시 옮겨지는 일을 막기 위한 순서)
          const r1 = await withTimeout(supabaseClient.from('submissions').delete().eq('student_id', String(targetId)));
          const r2 = await withTimeout(supabaseClient.from('students').delete().eq('student_id', String(targetId)));
          cloudFailed = !!(r1.error || r2.error);
        } catch(err) {
          console.error('Student Delete Cloud Error:', err);
          cloudFailed = true;
        }
        if (cloudFailed) { showToast('서버에서 삭제하지 못했습니다. 잠시 후 다시 시도해 주세요.', 5000); return; }
        purgeLocalStudent(targetId);
        setEditingStudentModal(false);
        setEditingStudentTargetId(null);
        showToast(sName + ' 학생의 계정과 기록이 모두 삭제되었습니다. 🗑️');
      };

      // [엑셀 다운로드] 서버의 최신 기록으로 4개 시트를 담은 .xlsx 파일 만들기
      const [excelBusy, setExcelBusy] = useState(false);
      const downloadExcel = async function() {
        if (excelBusy) return;
        setExcelBusy(true);
        let source = null;
        let groups = groupInfoRef.current;
        try {
          if (cloudReady()) {
            const res = await withTimeout(supabaseClient.from('submissions').select('student_id, data'));
            if (!res.error && res.data) {
              source = {};
              res.data.forEach(function(row) { if (row.student_id && row.data) source[row.student_id] = row.data; });
            } else if (isNetworkFailure(res)) {
              markOffline();
            }
            const gr = await withTimeout(supabaseClient.from('group_info').select('class_no, group_no, title, video_url, members, plan_score, perform_score'));
            if (!gr.error && gr.data) {
              groups = {};
              gr.data.forEach(function(r) { groups[groupKey(r.class_no, r.group_no)] = r; });
              mergeGroupRows(gr.data);
            }
          }
        } catch (err) {
          if (isNetworkFailure(err)) markOffline();
        }
        try {
          const bytes = buildXlsxBytes(buildGradeWorkbook(source || allSubmissions, groups));
          const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = '송악고_공연평가_' + new Date().toLocaleDateString('ko-KR').replace(/\.\s?/g, '-').replace(/-$/, '') + '.xlsx';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
          showToast(source
            ? '엑셀 파일을 다운로드했습니다. (요약 · 활동 기록 · 상호평가 · 모둠별 요약, 노란 칸은 제출하지 않은 작성 중 내용) 📊'
            : '서버 응답이 없어 지금 화면에 있는 기록으로 엑셀 파일을 만들었습니다.', 6000);
        } catch (err) {
          console.error('Excel Export Error:', err);
          showToast('엑셀 파일을 만들지 못했습니다. 잠시 후 다시 시도해 주세요.', 5000);
        } finally {
          setExcelBusy(false);
        }
      };

      // [점수 확정] 로그인(또는 페이지를 연) 직후 서버에서 내 기록을 받아 온 시점에 한 번만 팝업 판단
      const finalPopupPendingRef = useRef(!!(currentUser && currentUser.role === 'student'));
      useEffect(function() {
        if (!currentUser || currentUser.role !== 'student') { setShowFinalPopup(false); return; }
        if (!finalPopupPendingRef.current || !studentCloudLoaded) return;
        finalPopupPendingRef.current = false;
        if (getConfirmed(allSubmissions[currentUser.id])) setShowFinalPopup(true);
      }, [studentCloudLoaded, allSubmissions, currentUser]);

      // 등록 화면에서 반을 고르면 그 반의 공연 제목·조원 이름만 받아 옴
      useEffect(function() {
        if (!isRegisterMode || !registerClass || !cloudReady()) { setRegGroups([]); return; }
        let alive = true;
        withTimeout(supabaseClient.from('group_info').select('class_no, group_no, title, members').eq('class_no', Number(registerClass)), SERVER_CHECK_MS)
          .then(function(res) { if (alive && !res.error && res.data) setRegGroups(res.data); })
          .catch(function() {});
        return function() { alive = false; };
      }, [isRegisterMode, registerClass, serverStatus]);

      const closedNow = isPortalClosedNow(portal);
      const myConfirmed = myId ? getConfirmed(mySub) : null;
      const studentLocked = !!(myId && (closedNow || myConfirmed));

      // ---------------------------------------------------------
      // 화면 그리기 도우미
      // ---------------------------------------------------------
      const sectionCard = function(num, title, desc, body, opts) {
        const o = opts || {};
        return e('section', { className: 'bg-white rounded-2xl border ' + (o.border || 'border-slate-200') + ' shadow-sm overflow-hidden' },
          e('div', { className: 'px-4 sm:px-5 py-3 border-b border-slate-100 flex items-start justify-between gap-3 ' + (o.head || 'bg-slate-50') },
            e('div', { className: 'flex items-start gap-2.5' },
              e('span', { className: 'w-7 h-7 shrink-0 rounded-lg bg-violet-600 text-white text-sm font-black flex items-center justify-center' }, num),
              e('div', null,
                e('h3', { className: 'text-sm font-black text-slate-900' }, title),
                desc && e('p', { className: 'text-2xs text-slate-500 mt-0.5 leading-relaxed' }, desc)
              )
            ),
            o.badge && e('span', { className: 'text-2xs font-bold px-2 py-0.5 rounded-full whitespace-nowrap ' + (o.badgeClass || 'bg-slate-200 text-slate-700') }, o.badge)
          ),
          e('div', { className: 'p-4 sm:p-5 space-y-3' }, body)
        );
      };

      const textArea = function(value, onChange, placeholder, rows, disabled) {
        return e('textarea', {
          value: value || '', rows: rows || 4, disabled: !!disabled, placeholder: placeholder,
          onChange: function(ev) { onChange(ev.target.value); },
          className: 'w-full p-3 border border-slate-300 rounded-xl text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-violet-400 disabled:bg-slate-100'
        });
      };

      const chip = function(key, label, active, onClick, sub) {
        return e('button', {
          key: key, type: 'button', onClick: onClick,
          className: 'px-3 py-2 rounded-xl border text-xs font-bold transition text-left ' + (active ? 'bg-violet-600 border-violet-600 text-white shadow' : 'bg-white border-slate-300 text-slate-700 hover:border-violet-400')
        }, e('span', { className: 'block' }, label), sub && e('span', { className: 'block text-2xs font-medium mt-0.5 ' + (active ? 'text-violet-100' : 'text-slate-400') }, sub));
      };

      // 반의 모둠 목록 (공연 제목·조원) — 학생이 자기 조를 찾을 때 참고
      const renderClassGroupList = function(c, selectedGroup, onPick) {
        return e('div', { className: 'grid grid-cols-1 sm:grid-cols-5 gap-2' },
          GROUPS.map(function(g) {
            const gi = groupInfo[groupKey(c, g)] || {};
            const active = Number(selectedGroup) === g;
            return e('button', {
              key: g, type: 'button', onClick: onPick ? function() { onPick(g); } : undefined, disabled: !onPick,
              className: 'p-3 rounded-xl border text-left transition ' + (active ? 'bg-violet-600 border-violet-600 text-white shadow' : 'bg-white border-slate-200 hover:border-violet-400') + (onPick ? '' : ' cursor-default')
            },
