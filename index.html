          const pc = Object.assign({}, prev.peerChecks || {}); pc[name] = v;
          return Object.assign({}, prev, { peerChecks: pc });
        });
      };
      // 내 조 친구 이름 (선생님이 적은 조원 이름에서 내 이름 빼기)
      const groupMateNames = function(c, g) {
        if (!c || !g) return [];
        const me = currentUser && currentUser.role === 'student' ? String(currentUser.name || '').trim() : '';
        return splitMembers((groupInfo[groupKey(c, g)] || {}).members).filter(function(n) { return n !== me; });
      };

      // 최종 제출 전에 빠진 것 찾기 (없으면 null)
      const findMissing = function(f) {
        if (!f.classNo || !f.groupNo) return '맨 위에서 내 반과 조를 먼저 골라 주세요.';
        const r = f.roles || {};
        for (let i = 0; i < ROLES.length; i++) {
          if (r[ROLES[i].key] && !tlen((f.roleDetails || {})[ROLES[i].key])) return '1번: [' + ROLES[i].label + '] 역할에서 한 활동 내용을 적어 주세요.';
        }
        if (!(f.perfTypes || []).length) return '2번: 공연 형태를 하나 이상 골라 주세요.';
        if (f.perfTypes.indexOf(PERF_ETC) !== -1 && !tlen(f.perfEtc)) return '2번: 기타 공연 형태가 무엇인지 적어 주세요.';
        const pl = perfTextLength(f);
        if (pl < PERF_MIN_LEN) return '2번: 개인 활동 내용을 모두 더해 ' + PERF_MIN_LEN + '자 이상 써 주세요. (지금 ' + pl + '자)';
        const names = Object.keys(f.peerChecks || {});
        for (let i = 0; i < names.length; i++) {
          if (!tlen(f.peerChecks[names[i]])) return '3번: ' + names[i] + ' 친구를 고른 이유를 적어 주세요. (해당 없으면 체크를 풀어 주세요)';
        }
        const others = otherGroups(f.groupNo);
        for (let i = 0; i < others.length; i++) {
          const ev = (f.evals || {})[String(others[i])] || {};
          if (!ev.stars) return '4번: ' + others[i] + '조 공연의 별점을 골라 주세요.';
          const el = evalTextLength(ev);
          if (el < EVAL_MIN_LEN) return '4번: ' + others[i] + '조 평가를 4칸 모두 더해 ' + EVAL_MIN_LEN + '자 이상 써 주세요. (지금 ' + el + '자)';
        }
        return null;
      };

      const saveAct = async function(isSubmit) {
        if (!currentUser) return;
        if (currentUser.role !== 'student') { showToast('교사 미리보기 화면에서는 저장되지 않습니다.'); return; }
        if (saveBusy) return;
        // 한 번 정해진 반·조는 학생이 바꿀 수 없음 (저장된 값을 그대로 씀)
        const saved = allSubmissions[currentUser.id] || {};
        const f = Object.assign({}, actForm, {
          classNo: saved.classNo || actForm.classNo,
          groupNo: saved.groupNo || actForm.groupNo
        });
        const firstPlace = !saved.classNo || !saved.groupNo;
        if (isSubmit) {
          const miss = findMissing(f);
          if (miss) { showToast(miss, 5000); return; }
        } else if (!f.classNo || !f.groupNo) {
          showToast('맨 위에서 내 반과 조를 먼저 골라 주세요.', 4000);
          return;
        }
        if (firstPlace && f.classNo && f.groupNo &&
            !window.confirm('2학년 ' + f.classNo + '반 ' + f.groupNo + '조가 맞나요?\n한 번 저장하면 반과 조를 바꿀 수 없어요. (잘못 골랐다면 선생님께 말씀드려야 해요)')) return;
        setSaveBusy(true);
        try {
          const blocked = await studentEditBlocked();
          if (blocked) {
            showToast(lockMessage(blocked) + ' 지금 작성한 내용은 반영되지 않습니다.', 7000);
            formDirtyRef.current = false;
            return;
          }
          const id = currentUser.id;
          const sData = allSubmissions[id] || { studentId: id, studentName: currentUser.name, reports: {} };
          const evals = {};
          otherGroups(f.groupNo).forEach(function(g) {
            const ev = (f.evals || {})[String(g)];
            if (evalHasContent(ev)) {
              const keep = { stars: ev.stars || 0 };
              EVAL_FIELDS.forEach(function(x) { keep[x.key] = ev[x.key] || ''; });
              evals[String(g)] = keep;
            }
          });
          const r = f.roles || {};
          const roleDetails = {};
          ROLES.forEach(function(x) { if (r[x.key]) roleDetails[x.key] = (f.roleDetails || {})[x.key] || ''; });
          const perfTypes = (f.perfTypes || []).slice();
          const perfDetails = {};
          perfTypes.forEach(function(t) {
            const d = (f.perfDetails || {})[t] || {};
            perfDetails[t] = { what: d.what || '', process: d.process || '' };
          });
          // 고른 조의 조원 명단에 있는 이름만 남김 (조를 바꾼 경우)
          const mates = groupMateNames(f.classNo, f.groupNo);
          const peerChecks = {};
          Object.keys(f.peerChecks || {}).forEach(function(n) {
            if (!mates.length || mates.indexOf(n) !== -1) peerChecks[n] = f.peerChecks[n] || '';
          });
          const act = {
            roles: { lead: !!r.lead, cuesheet: !!r.cuesheet, editor: !!r.editor },
            roleDetails: roleDetails,
            perfTypes: perfTypes,
            perfEtc: perfTypes.indexOf(PERF_ETC) !== -1 ? (f.perfEtc || '') : '',
            perfDetails: perfDetails,
            difficulty: f.difficulty || '',
            episode: f.episode || '',
            completion: f.completion || '',
            peerChecks: peerChecks,
            peerIssue: f.peerIssue || '',
            evals: evals,
            isSubmitted: !!isSubmit,
            updatedAt: new Date().toLocaleString('ko-KR')
          };
          const fullData = Object.assign({}, sData, {
            studentId: id, studentName: sData.studentName || currentUser.name,
            classNo: Number(f.classNo), groupNo: Number(f.groupNo),
            reports: Object.assign({}, sData.reports || {}, { act: act })
          });

          // 1) 먼저 이 기기에 저장 (서버가 느려도 학생이 기다리지 않도록)
          const upLocal = Object.assign({}, allSubmissions, { [id]: fullData });
          if (!safeSetLocal('perf_submissions', JSON.stringify(upLocal))) {
            showToast('기기 저장 공간이 부족합니다. 브라우저의 다른 사이트 데이터를 정리한 뒤 다시 저장해 주세요.', 6000);
            return;
          }
          formDirtyRef.current = false;
          setAllSubmissions(upLocal);
          addPendingSync(id);
          const offlineMsg = isSubmit
            ? '최종 제출로 이 기기에 저장했습니다. 서버가 돌아오면 선생님께 자동 전달됩니다. 📦'
            : '이 기기에 임시 저장했습니다. 서버가 돌아오면 자동으로 전달됩니다. 💾';
          if (!cloudReady()) { showToast(offlineMsg, 5000); return; }

          // 2) 서버로 전송
          showToast('이 기기에 저장했어요. 선생님께 전송하는 중…', 30000);
          const stillExists = await verifyStudentStillExists(currentUser);
          if (!stillExists) return;

          // 서버의 최신 채점 결과를 덮어쓰지 않도록 가져와 유지
          try {
            const res = await withTimeout(supabaseClient.from('submissions').select('grading:data->grading').eq('student_id', String(id)).maybeSingle(), SERVER_CHECK_MS);
            if (isNetworkFailure(res)) {
              markOffline();
            } else if (res.error) {
              const res2 = await withTimeout(supabaseClient.from('submissions').select('data').eq('student_id', String(id)).maybeSingle(), SERVER_CHECK_MS);
              if (isNetworkFailure(res2)) markOffline();
              else if (res2.data && res2.data.data && res2.data.data.grading) fullData.grading = res2.data.data.grading;
            } else if (res.data && res.data.grading) {
              fullData.grading = res.data.grading;
            } else {
              delete fullData.grading;
            }
          } catch (err) {
            if (isNetworkFailure(err)) markOffline();
          }

          const sent = await syncStudentToCloud(id, fullData);
          const why = sent ? null : lockReasonAfterFailedSync();
          if (why) {
            removePendingSync(id);
            fetchSubmissionsFromCloud({ role: 'student', id: id });
            showToast(lockMessage(why) + ' 방금 작성한 내용은 반영되지 않았습니다.', 7000);
            return;
          }
          if (sent) {
            removePendingSync(id);
            putLocalSub(id, fullData);
            if (Number(saved.classNo || 0) !== Number(fullData.classNo)) await fetchGroupInfo(currentUser, fullData.classNo);
            fetchMyGroupScores(fullData.classNo, fullData.groupNo);
            showToast(isSubmit ? '최종 제출되었습니다! 선생님 화면에 바로 보입니다. 🎉' : '임시 저장되었습니다. (클라우드 저장 완료) 💾', 4000);
          } else {
            showToast(offlineMsg, 5000);
          }
        } finally {
          setSaveBusy(false);
        }
      };

      // =========================================================
      // [교사] 채점·모둠 점수·확정
      // =========================================================
      const resetAllData = async function() {
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        const c = prompt('모든 학생 계정(학번/비밀번호), 활동 기록, 모둠 정보(공연 제목·영상 링크·모둠 점수)를 완전히 삭제하시겠습니까?\n진행하시려면 "RESET"을 입력하세요.');
        if (c !== 'RESET') return;
        let failed = false;
        try {
          const r1 = await withTimeout(supabaseClient.from('submissions').delete().neq('student_id', '_empty_'));
          const r2 = await withTimeout(supabaseClient.from('students').delete().neq('student_id', '_empty_'));
          const r3 = await withTimeout(supabaseClient.from('group_info').delete().gte('class_no', 0));
          failed = !!(r1.error || r2.error || r3.error);
        } catch (err) {
          console.error('Cloud Reset Error:', err);
          failed = true;
        }
        try {
          localStorage.removeItem('perf_submissions');
          localStorage.removeItem('perf_student_accounts');
          localStorage.removeItem('perf_group_info');
          localStorage.removeItem('perf_pending_sync');
        } catch (err) {}
        setAllSubmissions({});
        setGroupInfo({});
        groupInfoRef.current = {};
        setGroupDrafts({});
        showToast(failed ? '일부 데이터를 서버에서 지우지 못했습니다. [새로고침] 후 다시 시도해 주세요.' : '모든 데이터가 초기화되었습니다. 🔄', 5000);
        fetchSubmissionsFromCloud();
      };

      // 서버에서 한 학생 기록 읽기 (없으면 null, 연결 실패면 'offline')
      const readSubFromCloud = async function(studentId) {
        try {
          const res = await withTimeout(supabaseClient.from('submissions').select('data').eq('student_id', String(studentId)).maybeSingle(), SERVER_CHECK_MS);
          if (isNetworkFailure(res)) { markOffline(); return 'offline'; }
          if (res.error) return null;
          return (res.data && res.data.data) || null;
        } catch (err) {
          if (isNetworkFailure(err)) { markOffline(); return 'offline'; }
          return null;
        }
      };

      // 모둠 정보 저장 (patch: title, video_url, members, plan_score, perform_score 중 일부). 성공하면 저장된 행
      const lastGroupErrorRef = useRef(null);
      // 저장 실패 이유를 선생님이 알 수 있게 안내
      const groupErrorText = function() {
        const er = lastGroupErrorRef.current;
        if (!er) return '잠시 후 다시 시도해 주세요.';
        const msg = String(er.message || '');
        if (er.code === 'PGRST205' || er.code === '42P01' || /group_info/.test(msg) && /schema cache|does not exist/.test(msg)) return '서버에 모둠 정보 표(group_info)가 없습니다. 통합 SQL을 실행했는지 확인해 주세요.';
        if (er.code === '42501' || /permission denied|row-level security/i.test(msg)) return '서버에서 모둠 정보 표에 쓸 권한이 없습니다. 안내된 권한 SQL을 실행해 주세요.';
        return '(' + (er.code ? er.code + ': ' : '') + msg + ')';
      };
      const saveGroupRow = async function(c, g, patch) {
        const cur = groupInfoRef.current[groupKey(c, g)] || {};
        const row = {
          class_no: Number(c), group_no: Number(g),
          title: cur.title || '', video_url: cur.video_url || '', members: cur.members || '',
          plan_score: isNum(cur.plan_score) ? cur.plan_score : null,
          perform_score: isNum(cur.perform_score) ? cur.perform_score : null,
          updated_at: new Date().toISOString()
        };
        Object.assign(row, patch);
        const res = await withTimeout(supabaseClient.from('group_info').upsert(row, { onConflict: 'class_no,group_no' }), SERVER_CHECK_MS);
        if (res.error) {
          if (isNetworkFailure(res)) markOffline();
          lastGroupErrorRef.current = res.error;
          console.error('group_info save error:', res.error);
          return null;
        }
        lastGroupErrorRef.current = null;
        mergeGroupRows([row]);
        return row;
      };

      // 모둠 점수가 바뀌면, 확정된 조원 중 확정 점수와 달라진 학생의 확정을 풀어 줌. 풀린 학생 이름 목록
      const releaseGroupConfirmations = async function(c, g, exceptId) {
        const released = [];
        const ids = Object.keys(allSubmissions).filter(function(id) {
          const s = allSubmissions[id];
          return id !== exceptId && s && Number(s.classNo) === Number(c) && Number(s.groupNo) === Number(g) && getConfirmed(s);
        });
        for (let i = 0; i < ids.length; i++) {
          const t = await readSubFromCloud(ids[i]);
          if (!t || t === 'offline' || !getConfirmed(t)) continue;
          if (Number(t.classNo) !== Number(c) || Number(t.groupNo) !== Number(g)) continue;
          if (!snapshotDiffers(t.grading.confirmed, computeScores(t, groupInfoRef.current))) continue;
          const grading = Object.assign({}, t.grading);
          delete grading.confirmed;
          const updated = Object.assign({}, t, { grading: grading });
          if (await syncStudentToCloud(ids[i], updated)) {
            putLocalSub(ids[i], updated);
            released.push(t.studentName || ids[i]);
          }
        }
        return released;
      };

      const scoreVal = function(v) { return v === '' || v === null || v === undefined ? null : Number(v); };

      const openGrading = function(s) {
        const gi = groupInfo[groupKey(s.classNo, s.groupNo)] || {};
        const ind = (s.grading && s.grading.ind) || {};
        const v = function(x) { return isNum(x) ? String(x) : ''; };
        setGradingForm({
          plan: v(gi.plan_score), perform: v(gi.perform_score),
          participation: v(ind.participation), review: v(ind.review),
          comment: ind.comment || '', teacherFeedback: (s.grading && s.grading.teacherFeedback) || ''
        });
        setGradingStudentId(s.studentId);
      };

      const saveGrading = async function(studentId) {
        if (!studentId || gradingBusy) return;
        if (!cloudReady()) { showToast('서버 응답이 없어 채점을 저장할 수 없습니다. 창을 닫지 말고 서버가 돌아오면 다시 저장해 주세요.', 6000); return; }
        setGradingBusy(true);
        try {
          const target = await readSubFromCloud(studentId);
          if (target === 'offline') { showToast(SERVER_DOWN_MSG, 6000); return; }
          if (!target) { showToast('학생 기록을 찾지 못했습니다. [새로고침]을 누른 뒤 다시 시도해 주세요.'); return; }
          const name = target.studentName || studentId;
          const nowStr = new Date().toLocaleString('ko-KR');
          const notes = [];

          // 1) 모둠 점수 (조원 모두에게 적용)
          const c = target.classNo, g = target.groupNo;
          const plan = scoreVal(gradingForm.plan), perform = scoreVal(gradingForm.perform);
          if (c && g) {
            const gi = groupInfoRef.current[groupKey(c, g)] || {};
            const curPlan = isNum(gi.plan_score) ? gi.plan_score : null;
            const curPerform = isNum(gi.perform_score) ? gi.perform_score : null;
            if (plan !== curPlan || perform !== curPerform) {
              const row = await saveGroupRow(c, g, { plan_score: plan, perform_score: perform });
              if (!row) { showToast('모둠 점수를 저장하지 못했습니다. ' + groupErrorText(), 9000); return; }
              const members = Object.keys(allSubmissions).filter(function(id) { const s = allSubmissions[id]; return s && Number(s.classNo) === Number(c) && Number(s.groupNo) === Number(g); }).length;
              notes.push(c + '반 ' + g + '조 모둠 점수 저장 (조원 ' + Math.max(members, 1) + '명에게 적용)');
              const rel = await releaseGroupConfirmations(c, g, studentId);
              if (rel.length) notes.push('모둠 점수가 바뀌어 ' + rel.join(', ') + ' 학생의 확정이 해제됨');
            }
          }

          // 2) 개인 점수
          const prevGrading = target.grading || {};
          const act = target.reports && target.reports.act;
          const participation = scoreVal(gradingForm.participation), review = scoreVal(gradingForm.review);
          const comment = (gradingForm.comment || '').trim();
          let ind = prevGrading.ind || null;
          if (participation !== null || review !== null || comment) {
            ind = {
              participation: participation, review: review, comment: comment,
              reportVersion: act ? act.updatedAt : null,
              gradedAt: nowStr
            };
          } else {
            ind = null;
          }
          const grading = Object.assign({}, prevGrading, {
            ind: ind || undefined,
            teacherFeedback: gradingForm.teacherFeedback || '',
            gradedAt: nowStr
          });
          if (!ind) delete grading.ind;

          // 3) 확정 유지 여부: 확정 때와 점수가 달라지면 확정을 풀어 다시 확정하게 함
          let released = false;
          if (grading.confirmed) {
            const after = computeScores(Object.assign({}, target, { grading: grading }), groupInfoRef.current);
            if (snapshotDiffers(grading.confirmed, after)) { delete grading.confirmed; released = true; }
          }
          const updated = Object.assign({}, target, { grading: grading });
          const ok = await syncStudentToCloud(studentId, updated);
          if (!ok) { showToast('채점을 저장하지 못했습니다. 창을 닫지 말고 잠시 후 다시 저장해 주세요.', 6000); return; }
          putLocalSub(studentId, updated);
          setGradingStudentId(null);
          const sc = computeScores(updated, groupInfoRef.current);
          showToast(name + ' 학생 채점 저장 (총점 ' + sc.total + ' / ' + TOTAL_MAX + '점) 🌟' +
            (notes.length ? ' · ' + notes.join(' · ') : '') +
            (released ? ' · 점수가 바뀌어 이 학생의 확정이 해제되었습니다. 다시 [확정하기]를 눌러 주세요.' : ''), notes.length || released ? 8000 : 3500);
        } finally {
          setGradingBusy(false);
        }
      };

      // [교사] 점수 확정하기 / 확정 취소
      const setStudentConfirmed = async function(studentId, makeConfirmed) {
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        const target = await readSubFromCloud(studentId);
        if (target === 'offline') { showToast(SERVER_DOWN_MSG, 6000); return; }
        if (!target) { showToast('학생 기록을 찾지 못했습니다. [새로고침]을 누른 뒤 다시 시도해 주세요.'); return; }
        const name = target.studentName || studentId;
        const grading = Object.assign({}, target.grading || {});

        if (makeConfirmed) {
          if (target.classNo && target.groupNo) await fetchGroupInfo(currentUserRef.current);
          const sc = computeScores(target, groupInfoRef.current);
          if (!sc.any) { showToast('채점된 점수가 없어 확정할 수 없습니다. 먼저 채점해 주세요.', 5000); return; }
          const line = function(it) { return it.label + ': ' + (sc[it.key] === null ? '채점 전 (0점으로 확정됨)' : sc[it.key] + ' / ' + it.max); };
          const st = getActStatus(target);
          const msg = name + ' 학생의 점수를 확정할까요?\n\n' +
            SCORE_ITEMS.map(line).join('\n') + '\n합계: ' + sc.total + ' / ' + TOTAL_MAX + '점\n\n' +
            (!sc.complete ? '⚠ 아직 채점하지 않은 항목이 있어요.\n\n' : '') +
            (st.kind === 'resubmitted' ? '⚠ 학생이 채점 뒤에 활동 기록을 다시 제출했어요.\n\n' : '') +
            '확정하면 학생에게 최종 점수로 보이고, 학생은 더 이상 활동 기록을 고칠 수 없습니다.';
          if (!window.confirm(msg)) return;
          grading.confirmed = { plan: sc.plan, perform: sc.perform, participation: sc.participation, review: sc.review, total: sc.total, at: new Date().toLocaleString('ko-KR') };
        } else {
          if (!window.confirm(name + ' 학생의 점수 확정을 취소할까요?\n학생 화면의 "최종 점수" 표시가 사라지고, 마감 전이라면 학생이 다시 활동 기록을 고칠 수 있습니다.')) return;
          delete grading.confirmed;
        }

        const updated = Object.assign({}, target, { grading: grading });
        const ok = await syncStudentToCloud(studentId, updated);
        if (!ok) { showToast('저장하지 못했습니다. 잠시 후 다시 시도해 주세요.', 5000); return; }
        putLocalSub(studentId, updated);
        showToast(makeConfirmed
          ? name + ' 학생의 점수를 확정했습니다. (최종 ' + grading.confirmed.total + ' / ' + TOTAL_MAX + '점) ✅'
          : name + ' 학생의 점수 확정을 취소했습니다.', 5000);
      };

      // [교사] 모둠 관리: 공연 제목·영상 링크·조원·모둠 점수 저장
      const getGroupDraft = function(c, g) {
        const k = groupKey(c, g);
        if (groupDrafts[k]) return groupDrafts[k];
        const gi = groupInfo[k] || {};
        return {
          title: gi.title || '', video_url: gi.video_url || '', members: gi.members || '',
          plan: isNum(gi.plan_score) ? String(gi.plan_score) : '', perform: isNum(gi.perform_score) ? String(gi.perform_score) : ''
        };
      };
      const setGroupDraft = function(c, g, patch) {
        const k = groupKey(c, g);
        setGroupDrafts(function(prev) {
          return Object.assign({}, prev, { [k]: Object.assign({}, prev[k] || getGroupDraft(c, g), patch) });
        });
      };
      const saveGroupCard = async function(c, g) {
        const k = groupKey(c, g);
        if (groupBusy) return;
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        const d = getGroupDraft(c, g);
        const url = (d.video_url || '').trim();
        if (url && !/^https?:\/\//i.test(url)) { showToast('영상 링크는 https:// 로 시작하는 주소를 붙여 넣어 주세요.', 5000); return; }
        setGroupBusy(k);
        try {
          const gi = groupInfoRef.current[k] || {};
          const plan = scoreVal(d.plan), perform = scoreVal(d.perform);
          const scoreChanged = plan !== (isNum(gi.plan_score) ? gi.plan_score : null) || perform !== (isNum(gi.perform_score) ? gi.perform_score : null);
          const row = await saveGroupRow(c, g, { title: (d.title || '').trim(), video_url: url, members: (d.members || '').trim(), plan_score: plan, perform_score: perform });
          if (!row) { showToast('저장하지 못했습니다. ' + groupErrorText(), 9000); return; }
          setGroupDrafts(function(prev) { const up = Object.assign({}, prev); delete up[k]; return up; });
          let rel = [];
          if (scoreChanged) rel = await releaseGroupConfirmations(c, g, null);
          showToast(c + '반 ' + g + '조 정보를 저장했습니다.' + (rel.length ? ' 모둠 점수가 바뀌어 ' + rel.join(', ') + ' 학생의 확정이 해제되었습니다.' : ''), rel.length ? 7000 : 3000);
        } finally {
          setGroupBusy('');
        }
      };

      // [교사] 학생 정보 수정 (학번·성명·반·조)
      const saveStudentInfoEdit = async function(ev) {
        ev.preventDefault();
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        if (!editingStudentTargetId) return;
        const oldId = editingStudentTargetId;
        const newId = editingStudentForm.id.trim();
        const newName = editingStudentForm.name.trim();
        const newClass = editingStudentForm.classNo ? Number(editingStudentForm.classNo) : null;
        const newGroup = editingStudentForm.groupNo ? Number(editingStudentForm.groupNo) : null;
        if (!ID_RULE.test(newId)) { showToast('학번은 숫자 4~5자리로 입력해 주세요.'); return; }
        if (!newName) { showToast('성명을 입력해 주세요.'); return; }

        let currentPw = '0000';
        try {
          const oldAcc = await cloudGetAccount(oldId);
          if (oldAcc.error) { showAccountError(oldAcc.error); return; }
          if (oldAcc.data) currentPw = oldAcc.data.pw;
          if (oldId !== newId) {
            const dup = await cloudGetAccount(newId);
            if (dup.data || allSubmissions[newId]) { showToast('변경하려는 학번(' + newId + ')이 이미 존재합니다.'); return; }
          }
        } catch (err) {
          showAccountError(err);
          return;
        }

        const cur = await readSubFromCloud(oldId);
        if (cur === 'offline') { showToast(SERVER_DOWN_MSG, 6000); return; }
        const base = cur || allSubmissions[oldId] || { studentId: oldId, studentName: newName, reports: {} };
        const updated = Object.assign({}, base, { studentId: newId, studentName: newName });
        if (newClass) updated.classNo = newClass; else delete updated.classNo;
        if (newGroup) updated.groupNo = newGroup; else delete updated.groupNo;
        let releasedNote = '';
        if (getConfirmed(updated) && (Number(base.classNo) !== Number(updated.classNo) || Number(base.groupNo) !== Number(updated.groupNo))) {
          if (snapshotDiffers(updated.grading.confirmed, computeScores(updated, groupInfoRef.current))) {
            updated.grading = Object.assign({}, updated.grading);
            delete updated.grading.confirmed;
            releasedNote = ' 모둠이 바뀌어 모둠 점수가 달라졌으므로 확정이 해제되었습니다.';
          }
        }

        try {
          const accRes = await withTimeout(supabaseClient.from('students').upsert({ student_id: String(newId), name: newName, pw: currentPw }, { onConflict: 'student_id' }));
          if (accRes.error) { showAccountError(accRes.error); return; }
          let ok;
          if (oldId !== newId && cur) {
            // 학번 변경: 기존 줄을 새 학번으로 옮김 (활동 기록은 그대로라 마감 뒤에도 가능)
            const mv = await withTimeout(supabaseClient.from('submissions').update({ student_id: String(newId), data: updated, updated_at: new Date().toISOString() }).eq('student_id', String(oldId)));
            ok = !mv.error;
          } else {
            ok = await syncStudentToCloud(newId, updated);
          }
          if (!ok) { showToast('학생 정보를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.', 5000); return; }
          if (oldId !== newId) {
            await withTimeout(supabaseClient.from('submissions').delete().eq('student_id', String(oldId)));
            await withTimeout(supabaseClient.from('students').delete().eq('student_id', String(oldId)));
          }
        } catch (err) {
          console.error('Student Edit Cloud Error:', err);
          showToast(SERVER_DOWN_MSG, 6000);
          return;
        }

        const accs = getStudentAccounts();
        if (accs[oldId]) { delete accs[oldId]; safeSetLocal('perf_student_accounts', JSON.stringify(accs)); }
        setAllSubmissions(function(prev) {
          const up = Object.assign({}, prev);
          delete up[oldId];
          up[newId] = updated;
          safeSetLocal('perf_submissions', JSON.stringify(up));
          return up;
        });
        setEditingStudentModal(false);
        setEditingStudentTargetId(null);
        showToast(newName + ' 학생 정보가 수정되었습니다. ✏️' + releasedNote, releasedNote ? 7000 : 3000);
      };

      // [교사] 학생 한 명 기록 영구 삭제
      const deleteSingleStudent = async function() {
        if (!editingStudentTargetId) return;
        if (!cloudReady()) { showToast(SERVER_DOWN_MSG, 6000); return; }
        const target = allSubmissions[editingStudentTargetId];
        const sName = (target && target.studentName) || editingStudentTargetId;
        const c = prompt(
          '정말로 ' + sName + ' (' + editingStudentTargetId + ') 학생의 모든 데이터(계정, 활동 기록, 다른 모둠 평가, 채점 내역)를 삭제하시겠습니까?\n' +
          '삭제하려면 "삭제"라고 입력하세요.'
        );
        if (c !== '삭제') { showToast('삭제가 취소되었습니다.'); return; }
        const targetId = editingStudentTargetId;
        let cloudFailed = false;
        try {
          // 기록을 먼저 지운 뒤 계정을 지움 (학생 기기에서 계정이 다시 옮겨지는 일을 막기 위한 순서)
          const r1 = await withTimeout(supabaseClient.from('submissions').delete().eq('student_id', String(targetId)));
          const r2 = await withTimeout(supabaseClient.from('students').delete().eq('student_id', String(targetId)));
          cloudFailed = !!(r1.error || r2.error);
        } catch(err) {
          console.error('Student Delete Cloud Error:', err);
          cloudFailed = true;
        }
        if (cloudFailed) { showToast('서버에서 삭제하지 못했습니다. 잠시 후 다시 시도해 주세요.', 5000); return; }
        purgeLocalStudent(targetId);
        setEditingStudentModal(false);
        setEditingStudentTargetId(null);
        showToast(sName + ' 학생의 계정과 기록이 모두 삭제되었습니다. 🗑️');
      };

      // [엑셀 다운로드] 서버의 최신 기록으로 4개 시트를 담은 .xlsx 파일 만들기
      const [excelBusy, setExcelBusy] = useState(false);
      const downloadExcel = async function() {
        if (excelBusy) return;
        setExcelBusy(true);
        let source = null;
        let groups = groupInfoRef.current;
        try {
          if (cloudReady()) {
            const res = await withTimeout(supabaseClient.from('submissions').select('student_id, data'));
            if (!res.error && res.data) {
              source = {};
              res.data.forEach(function(row) { if (row.student_id && row.data) source[row.student_id] = row.data; });
            } else if (isNetworkFailure(res)) {
              markOffline();
            }
            const gr = await withTimeout(supabaseClient.from('group_info').select('class_no, group_no, title, video_url, members, plan_score, perform_score'));
            if (!gr.error && gr.data) {
              groups = {};
              gr.data.forEach(function(r) { groups[groupKey(r.class_no, r.group_no)] = r; });
              mergeGroupRows(gr.data);
            }
          }
        } catch (err) {
          if (isNetworkFailure(err)) markOffline();
        }
        try {
          const bytes = buildXlsxBytes(buildGradeWorkbook(source || allSubmissions, groups));
          const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = '송악고_공연평가_' + new Date().toLocaleDateString('ko-KR').replace(/\.\s?/g, '-').replace(/-$/, '') + '.xlsx';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
          showToast(source
            ? '엑셀 파일을 다운로드했습니다. (요약 · 활동 기록 · 상호평가 · 모둠별 요약, 노란 칸은 제출하지 않은 작성 중 내용) 📊'
            : '서버 응답이 없어 지금 화면에 있는 기록으로 엑셀 파일을 만들었습니다.', 6000);
        } catch (err) {
          console.error('Excel Export Error:', err);
          showToast('엑셀 파일을 만들지 못했습니다. 잠시 후 다시 시도해 주세요.', 5000);
        } finally {
          setExcelBusy(false);
        }
      };

      // [점수 확정] 로그인(또는 페이지를 연) 직후 서버에서 내 기록을 받아 온 시점에 한 번만 팝업 판단
      const finalPopupPendingRef = useRef(!!(currentUser && currentUser.role === 'student'));
      useEffect(function() {
        if (!currentUser || currentUser.role !== 'student') { setShowFinalPopup(false); return; }
        if (!finalPopupPendingRef.current || !studentCloudLoaded) return;
        finalPopupPendingRef.current = false;
        if (getConfirmed(allSubmissions[currentUser.id])) setShowFinalPopup(true);
      }, [studentCloudLoaded, allSubmissions, currentUser]);

      // 등록 화면에서 반을 고르면 그 반의 공연 제목·조원 이름만 받아 옴
      useEffect(function() {
        if (!isRegisterMode || !registerClass || !cloudReady()) { setRegGroups([]); return; }
        let alive = true;
        withTimeout(supabaseClient.from('group_info').select('class_no, group_no, title, members').eq('class_no', Number(registerClass)), SERVER_CHECK_MS)
          .then(function(res) { if (alive && !res.error && res.data) setRegGroups(res.data); })
          .catch(function() {});
        return function() { alive = false; };
      }, [isRegisterMode, registerClass, serverStatus]);

      const closedNow = isPortalClosedNow(portal);
      const myConfirmed = myId ? getConfirmed(mySub) : null;
      const studentLocked = !!(myId && (closedNow || myConfirmed));

      // ---------------------------------------------------------
      // 화면 그리기 도우미
      // ---------------------------------------------------------
      const sectionCard = function(num, title, desc, body, opts) {
        const o = opts || {};
        return e('section', { className: 'bg-white rounded-2xl border ' + (o.border || 'border-slate-200') + ' shadow-sm overflow-hidden' },
          e('div', { className: 'px-4 sm:px-5 py-3 border-b border-slate-100 flex items-start justify-between gap-3 ' + (o.head || 'bg-slate-50') },
            e('div', { className: 'flex items-start gap-2.5' },
              e('span', { className: 'w-7 h-7 shrink-0 rounded-lg bg-violet-600 text-white text-sm font-black flex items-center justify-center' }, num),
              e('div', null,
                e('h3', { className: 'text-sm font-black text-slate-900' }, title),
                desc && e('p', { className: 'text-2xs text-slate-500 mt-0.5 leading-relaxed' }, desc)

    function isNetworkFailure(errOrRes) {
      if (!errOrRes) return false;
      const err = errOrRes.error !== undefined ? errOrRes.error : errOrRes;
      if (!err) return false;
      if (err.message === 'TIMEOUT') return true;
      const msg = String(err.message || '');

    let CRC_TABLE = null;
    function crc32(bytes) {
      if (!CRC_TABLE) {
        CRC_TABLE = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
          CRC_TABLE[n] = c >>> 0;
        }
      }
      let crc = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);

    // 압축하지 않는 zip (엑셀 파일은 zip 안에 xml 파일들이 들어 있는 형식)
    function zipStore(files) {
      const enc = new TextEncoder();
      const parts = [], central = [];
      let offset = 0;
      const u16 = function(v) { return [v & 0xFF, (v >>> 8) & 0xFF]; };
      const u32 = function(v) { return [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]; };
      files.forEach(function(f) {
        const name = enc.encode(f.name);
        const data = enc.encode(f.data);
        const crc = crc32(data);
        const local = [].concat([0x50, 0x4B, 0x03, 0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
        parts.push(new Uint8Array(local), name, data);
        const cen = [].concat([0x50, 0x4B, 0x01, 0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset));
        central.push(new Uint8Array(cen), name);
        offset += local.length + name.length + data.length;
      });
      const cenSize = central.reduce(function(a, b) { return a + b.length; }, 0);
      const end = new Uint8Array([].concat([0x50, 0x4B, 0x05, 0x06], u16(0), u16(0), u16(files.length), u16(files.length), u32(cenSize), u32(offset), u16(0)));
      const all = parts.concat(central, [end]);
      const total = all.reduce(function(a, b) { return a + b.length; }, 0);
      const out = new Uint8Array(total);
      let pos = 0;
      all.forEach(function(b) { out.set(b, pos); pos += b.length; });
      return out;
    }

      return t === PERF_ETC ? ('기타: ' + ((act && act.perfEtc) || '')) : t;
    }
    function perfTypeText(act) {
      if (!act || !act.perfTypes || !act.perfTypes.length) return '';
      return act.perfTypes.map(function(t) { return perfTypeName(t, act); }).join(', ');
    }

    // 2번 전체 글자 수 (고른 형태의 공연 내용·과정 + 공통 3칸)
    function perfTextLength(act) {
      if (!act) return 0;
      let n = 0;
      (act.perfTypes || []).forEach(function(t) {
        const d = (act.perfDetails || {})[t] || {};
        n += tlen(d.what) + tlen(d.process);
      });
      REFLECT_FIELDS.forEach(function(f) { n += tlen(act[f.key]); });
      return n;
    }

    // 다른 모둠 평가 한 개의 글자 수 (4칸 합계)
    function evalTextLength(ev) {
      if (!ev) return 0;
      return EVAL_FIELDS.reduce(function(n, f) { return n + tlen(ev[f.key]); }, 0);
    }
    function evalHasContent(ev) {
      return !!ev && (!!ev.stars || evalTextLength(ev) > 0);
    }
    // 평가 4칸을 한 글로 (엑셀·목록용)
    function evalJoined(ev) {
      if (!ev) return '';
      return EVAL_FIELDS.filter(function(f) { return tlen(ev[f.key]); }).map(function(f) { return '[' + f.label + '] ' + String(ev[f.key]).trim(); }).join('\n');
    }

    // 모둠원 평가 (체크한 친구 + 이유, 직접 쓴 내용) → 한 글
    function peerText(act) {
      if (!act) return '';
      const out = [];
      Object.keys(act.peerChecks || {}).forEach(function(name) {
        out.push(name + ': ' + String(act.peerChecks[name] || '').trim());
      });
      if (tlen(act.peerIssue)) out.push(String(act.peerIssue).trim());
      return out.join('\n');
    }

    // 다른 모둠 목록 (내 조 제외)
    function otherGroups(myGroup) {
      return GROUPS.filter(function(g) { return g !== Number(myGroup); });
    }

    // 활동 기록 상태
    function getActStatus(sub) {
      const act = sub && sub.reports && sub.reports.act;
      const ind = sub && sub.grading && sub.grading.ind;
      if (ind) {
        if (act && act.isSubmitted && ind.reportVersion !== act.updatedAt) return { kind: 'resubmitted', label: '다시 제출 (채점 전)' };
        return { kind: 'graded', label: act && act.isSubmitted ? '채점 완료' : '채점 완료 (미제출)' };
      }
      if (!act) return { kind: 'none', label: '작성 전' };
      if (!act.isSubmitted) return { kind: 'draft', label: '작성 중' };
      return { kind: 'submitted', label: '제출 완료' };
    }

    // 지금 점수 (모둠 점수는 모둠 정보에서, 개인 점수는 채점 기록에서). 채점 안 된 항목은 null
    function computeScores(sub, groupInfo) {
      const gi = sub && sub.classNo && sub.groupNo ? (groupInfo || {})[groupKey(sub.classNo, sub.groupNo)] : null;
      const ind = (sub && sub.grading && sub.grading.ind) || {};
      const out = {
        plan: gi && isNum(gi.plan_score) ? gi.plan_score : null,
        perform: gi && isNum(gi.perform_score) ? gi.perform_score : null,
        participation: isNum(ind.participation) ? ind.participation : null,
        review: isNum(ind.review) ? ind.review : null
      };
      out.total = (out.plan || 0) + (out.perform || 0) + (out.participation || 0) + (out.review || 0);
      out.any = SCORE_ITEMS.some(function(it) { return out[it.key] !== null; });
      out.complete = SCORE_ITEMS.every(function(it) { return out[it.key] !== null; });
      return out;
    }

    // [점수 확정] 확정 정보 (선생님이 [확정하기]를 눌렀을 때만 있음)
    function getConfirmed(sub) {
      return (sub && sub.grading && sub.grading.confirmed) || null;
    }

    function snapshotDiffers(conf, scores) {
      if (!conf) return false;
      return SCORE_ITEMS.some(function(it) {
        const a = conf[it.key] === undefined ? null : conf[it.key];
        return a !== scores[it.key];
      });
    }

    // 모둠이 받은 평가 모으기 (같은 반 다른 조 학생들이 쓴 평가)
    function collectGroupEvals(subs, c, g) {
      const out = [];
      Object.keys(subs || {}).forEach(function(id) {
        const s = subs[id];
        if (!s || Number(s.classNo) !== Number(c) || Number(s.groupNo) === Number(g)) return;
        const act = s.reports && s.reports.act;
        const ev = act && act.evals && act.evals[String(g)];
        if (!evalHasContent(ev)) return;
        out.push({ studentId: s.studentId || id, studentName: s.studentName || '', fromGroup: s.groupNo, stars: ev.stars || 0, ev: ev, submitted: !!act.isSubmitted });
      });
      out.sort(function(a, b) { return String(a.studentId).localeCompare(String(b.studentId), 'ko', { numeric: true }); });
      return out;
    }

    function evalStats(list) {
      const done = list.filter(function(x) { return x.submitted && x.stars > 0; });
      const avg = done.length ? done.reduce(function(a, x) { return a + x.stars; }, 0) / done.length : null;
      return { count: done.length, draftCount: list.length - done.length, avg: avg };
    }

    function sortById(list) {
      return list.slice().sort(function(a, b) { return String(a.studentId).localeCompare(String(b.studentId), 'ko', { numeric: true }); });
    }

    // =========================================================
    // [엑셀] 학생 기록 전체 → 시트 4장 (요약 / 활동 기록 / 상호평가 / 모둠별 요약)
    // =========================================================
    function buildGradeWorkbook(subs, groupInfo) {
      const H = function(v) { return { v: v, s: 1 }; };
      const idCell = function(id, st) { const t = String(id); return { v: /^[1-9]\d{0,14}$/.test(t) ? Number(t) : t, s: st }; };
      const list = sortById(Object.keys(subs || {})
        .filter(function(id) { return subs[id]; })
        .map(function(id) { return Object.assign({ studentId: id }, subs[id]); }));
      const blank = function(v) { return (v === null || v === undefined) ? '' : v; };

      // 1) 요약: 확정된 학생만 점수, 아니면 미확정
      const summary = { name: '요약', widths: [10, 12, 6, 6, 14, 12, 14, 16, 12], rows: [[
        H('학번'), H('성명'), H('반'), H('조'), H('공연 기획하기(20)'), H('공연하기(30)'), H('공연 참여 과정(10)'), H('감상평 작성하기(40)'), H('총점(100)')
      ]] };
      list.forEach(function(sub) {
        const c = getConfirmed(sub);
        const num = function(v) { return { v: blank(v), s: 4 }; };
        const un = { v: '미확정', s: 4 };
        summary.rows.push([
          idCell(sub.studentId, 4), { v: sub.studentName || '', s: 2 }, num(sub.classNo), num(sub.groupNo),
          c ? num(c.plan) : un, c ? num(c.perform) : un, c ? num(c.participation) : un, c ? num(c.review) : un, c ? num(c.total) : un
        ]);
      });

      // 2) 활동 기록 (학생 한 명당 한 줄, 노란 칸 = 최종 제출 안 한 작성 중 내용)
      const head = [
        ['학번', 9], ['성명', 10], ['반', 5], ['조', 5], ['상태', 16], ['최종 제출 시각', 22], ['마지막 저장 시각', 22],
        ['1. 맡은 역할', 16], ['1. 역할 활동 내용', 40], ['2. 공연 형태', 18], ['2. 공연 내용과 준비 과정', 50], ['2. 어려웠던 점과 해결 과정', 40], ['2. 기억에 남는 에피소드', 40], ['2. 공연 완성도', 40], ['3. 모둠원 평가 (교사만)', 30],
        ['4. 다른 모둠 평가 수', 10],
        ['공연 기획하기(20)', 10], ['공연하기(30)', 10], ['공연 참여 과정(10)', 10], ['감상평 작성하기(40)', 10], ['합계(100)', 10],
        ['채점 시각', 22], ['학생에게 보여 준 코멘트', 30], ['점수 확정', 26], ['세특 메모 (교사만)', 34]
      ];
      const acts = { name: '활동 기록', widths: head.map(function(h) { return h[1]; }), rows: [head.map(function(h) { return H(h[0]); })] };
      list.forEach(function(sub) {
        const act = sub.reports && sub.reports.act;
        const st = getActStatus(sub);
        const draft = !!act && !act.isSubmitted;
        const T = function(v) { return { v: blank(v), s: draft ? 3 : 2 }; };
        const N = function(v) { return { v: blank(v), s: draft ? 5 : 4 }; };
        const sc = computeScores(sub, groupInfo);
        const ind = (sub.grading && sub.grading.ind) || {};
        const conf = getConfirmed(sub);
        const evalCount = act && act.evals ? Object.keys(act.evals).filter(function(k) { return Number(k) !== Number(sub.groupNo) && evalHasContent(act.evals[k]); }).length : 0;
        const roleText = act ? ROLES.filter(function(r) { return act.roles && act.roles[r.key]; }).map(function(r) { return '[' + r.label + '] ' + String(((act.roleDetails || {})[r.key]) || '').trim(); }).join('\n') : '';
        const perfText = act ? (act.perfTypes || []).map(function(t) {
          const d = (act.perfDetails || {})[t] || {};
          return '[' + perfTypeName(t, act) + '] 공연: ' + String(d.what || '').trim() + ' / 과정: ' + String(d.process || '').trim();
        }).join('\n') : '';
        acts.rows.push([
          idCell(sub.studentId, draft ? 5 : 4), T(sub.studentName || ''), N(sub.classNo), N(sub.groupNo),
          { v: st.kind === 'none' ? '작성 전' : st.kind === 'draft' ? '작성 중 (미제출)' : st.label, s: draft ? 6 : 2 },
          T(act && act.isSubmitted ? act.updatedAt : ''), T(act ? act.updatedAt : ''),
          T(roleLabels(act).join(', ')), T(roleText), T(perfTypeText(act)), T(perfText), T(act ? act.difficulty : ''), T(act ? act.episode : ''), T(act ? act.completion : ''), T(peerText(act)),
          N(act ? evalCount : ''),
          N(sc.plan), N(sc.perform), N(sc.participation), N(sc.review), N(sc.any ? sc.total : ''),
          T(ind.gradedAt || ''), T(ind.comment || ''), T(conf ? '확정 (' + conf.at + ')' : '미확정'), T((sub.grading && sub.grading.teacherFeedback) || '')
        ]);
      });

      // 3) 상호평가 (평가 한 건당 한 줄)
      const evals = { name: '상호평가', widths: [9, 10, 5, 8, 8, 22, 7, 36, 36, 36, 36, 8, 12], rows: [[
        H('평가한 학생 학번'), H('성명'), H('반'), H('평가자 조'), H('평가 대상 조'), H('대상 공연 제목'), H('별점(5)'),
        H('예술성'), H('독창성'), H('개선점'), H('기타 의견'), H('글자 수'), H('상태')
      ]] };
      list.forEach(function(sub) {
        const act = sub.reports && sub.reports.act;
        if (!act || !act.evals) return;
        const draft = !act.isSubmitted;
        Object.keys(act.evals).sort().forEach(function(k) {
          const x = act.evals[k];
          if (!evalHasContent(x)) return;
          if (Number(k) === Number(sub.groupNo)) return;
          const gi = (groupInfo || {})[groupKey(sub.classNo, k)] || {};
          evals.rows.push([
            idCell(sub.studentId, draft ? 5 : 4), { v: sub.studentName || '', s: draft ? 3 : 2 },
            { v: blank(sub.classNo), s: draft ? 5 : 4 }, { v: blank(sub.groupNo), s: draft ? 5 : 4 }, { v: Number(k), s: draft ? 5 : 4 },
            { v: gi.title || '', s: draft ? 3 : 2 }, { v: x.stars || '', s: draft ? 5 : 4 }]
            .concat(EVAL_FIELDS.map(function(f) { return { v: x[f.key] || '', s: draft ? 3 : 2 }; }))
            .concat([{ v: evalTextLength(x), s: draft ? 5 : 4 },
            { v: draft ? '작성 중 (미제출)' : '제출', s: draft ? 6 : 2 }
          ]));
        });
      });

      // 4) 모둠별 요약 (평균 별점은 최종 제출한 평가만)
      const groups = { name: '모둠별 요약', widths: [5, 5, 24, 30, 26, 30, 10, 10, 12, 10], rows: [[
        H('반'), H('조'), H('공연 제목'), H('영상 링크'), H('조원 (선생님 입력)'), H('사이트에 등록한 조원'), H('받은 평가 수'), H('평균 별점'), H('공연 기획하기(20)'), H('공연하기(30)')
      ]] };
      CLASSES.forEach(function(c) {
        GROUPS.forEach(function(g) {
          const gi = (groupInfo || {})[groupKey(c, g)] || {};
          const members = list.filter(function(s) { return Number(s.classNo) === c && Number(s.groupNo) === g; });
          const stats = evalStats(collectGroupEvals(subs, c, g));
          if (!members.length && !gi.title && !gi.video_url && !gi.members && !stats.count) return;
          groups.rows.push([
            { v: c, s: 4 }, { v: g, s: 4 }, { v: gi.title || '', s: 2 }, { v: gi.video_url || '', s: 2 }, { v: gi.members || '', s: 2 },
            { v: members.map(function(s) { return s.studentName + '(' + s.studentId + ')'; }).join(', '), s: 2 },
            { v: stats.count, s: 4 }, { v: stats.avg === null ? '' : Math.round(stats.avg * 100) / 100, s: 4 },
            { v: blank(gi.plan_score), s: 4 }, { v: blank(gi.perform_score), s: 4 }
          ]);
        });
      });

      return [summary, acts, evals, groups];
    }

    // =========================================================
    // 화면 조각들
    // =========================================================
    const STATUS_STYLE = {
      none: 'bg-slate-100 text-slate-400',
      draft: 'bg-slate-100 text-slate-600',
      submitted: 'bg-blue-100 text-blue-700',
      resubmitted: 'bg-amber-100 text-amber-800',
      graded: 'bg-emerald-100 text-emerald-800'
    };
    const STATUS_ICON = {
      none: 'fa-minus',
      draft: 'fa-pen',
      submitted: 'fa-paper-plane',
      resubmitted: 'fa-rotate',
      graded: 'fa-circle-check'
    };

    function StatusBadge(props) {
      const st = props.status;
      const cls = 'inline-flex items-center gap-1 text-2xs font-extrabold px-2 py-0.5 rounded-full whitespace-nowrap ' + STATUS_STYLE[st.kind];
      return e('span', { className: cls },
        e('i', { className: 'fa-solid ' + STATUS_ICON[st.kind] }),
        e('span', null, st.label)
      );
    }

    // 별점 (readOnly면 보기만)
    function Stars(props) {
      const v = props.value || 0;
      const size = props.size || 'text-xl';
      return e('div', { className: 'inline-flex items-center gap-0.5' },
        [1, 2, 3, 4, 5].map(function(n) {
          const on = n <= v;
          const icon = e('i', { className: (on ? 'fa-solid text-amber-400' : 'fa-regular text-slate-300') + ' fa-star ' + size });
          if (props.readOnly) return e('span', { key: n }, icon);
          return e('button', {
            key: n, type: 'button', 'aria-label': n + '점',
            onClick: function() { props.onChange(n === v ? 0 : n); },
            className: 'p-0.5 hover:scale-110 transition'
          }, icon);
        }),
        !props.readOnly && e('span', { className: 'ml-1.5 text-xs font-bold ' + (v ? 'text-amber-600' : 'text-slate-400') }, v ? v + ' / 5' : '별점을 눌러 주세요')
      );
    }

    // 영상 보기: 유튜브면 버튼을 누를 때만 화면 안에서 재생 (서버 사용량 없음, 학생 데이터도 아끼도록)
    function VideoBox(props) {
      const [open, setOpen] = useState(false);
      const url = props.url;
      if (!url) return e('p', { className: 'text-2xs text-slate-400' }, '아직 영상 링크가 없어요.');
      const yid = youtubeId(url);
      return e('div', { className: 'space-y-2' },
        e('div', { className: 'flex flex-wrap gap-1.5' },
          yid && e('button', { type: 'button', onClick: function() { setOpen(!open); }, className: 'px-2.5 py-1 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-2xs font-bold inline-flex items-center gap-1' },
            e('i', { className: 'fa-brands fa-youtube' }), e('span', null, open ? '영상 닫기' : '여기서 영상 보기')),
          e('a', { href: url, target: '_blank', rel: 'noopener noreferrer', className: 'px-2.5 py-1 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 text-2xs font-bold inline-flex items-center gap-1' },
            e('i', { className: 'fa-solid fa-arrow-up-right-from-square' }), e('span', null, '새 창에서 열기'))
        ),
        open && yid && e('div', { className: 'relative w-full rounded-xl overflow-hidden bg-black', style: { paddingTop: '56.25%' } },
          e('iframe', {
            src: 'https://www.youtube-nocookie.com/embed/' + yid,
            title: '공연 영상', allow: 'accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen', allowFullScreen: true,
            className: 'absolute inset-0 w-full h-full', style: { border: 0 }
          })
        )
      );
    }

    // 점수표 (학생·교사 공용). scores: { plan, perform, participation, review, total }
    function ScoreTable(props) {
      const sc = props.scores;
      const cell = function(v, max) {
        return v === null || v === undefined
          ? e('span', { className: 'text-slate-400 font-bold text-xs' }, '채점 전')
          : e('span', { className: 'font-black text-slate-900' }, v, e('span', { className: 'text-2xs font-bold text-slate-400 ml-0.5' }, '/ ' + max));
      };
      const area = function(name, items, color) {
        return e('div', { className: 'rounded-xl border ' + color + ' overflow-hidden' },
          e('p', { className: 'px-3 py-1.5 text-2xs font-black border-b ' + color }, name),
          e('div', { className: 'divide-y divide-slate-100 bg-white' },
            items.map(function(it) {
              return e('div', { key: it.key, className: 'px-3 py-2 flex items-center justify-between text-xs' },
                e('span', { className: 'font-bold text-slate-700' }, it.label),
                cell(sc[it.key], it.max)
              );
            })
          )
        );
      };
      return e('div', { className: 'space-y-2' },
        e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-2' },
          area('모둠 평가 (조원 모두 같은 점수)', SCORE_ITEMS.slice(0, 2), 'border-violet-200 bg-violet-50 text-violet-900'),
          area('개인 평가', SCORE_ITEMS.slice(2), 'border-sky-200 bg-sky-50 text-sky-900')
        ),
        e('div', { className: 'flex items-center justify-between px-3 py-2.5 rounded-xl bg-slate-900 text-white' },
          e('span', { className: 'text-xs font-bold' }, props.final ? '최종 총점' : '총점 (지금까지 채점된 점수)'),
          e('span', { className: 'text-xl font-black' }, sc.total, e('span', { className: 'text-xs font-bold text-slate-300 ml-1' }, '/ ' + TOTAL_MAX + '점'))
        )
      );
    }

    // 학생 활동 기록 읽기 전용 보기 (교사 채점 창, 학생 마감 후 화면에서 사용)
    function ActView(props) {
      const act = props.act;
      const gi = props.groupInfo || {};
      if (!act) return e('div', { className: 'p-4 rounded-xl bg-slate-100 text-slate-500 text-xs' }, '아직 작성한 내용이 없습니다.');
      const box = function(title, body, note) {
        return e('div', { className: 'rounded-xl border border-slate-200 bg-white' },
          e('div', { className: 'px-3 py-2 border-b border-slate-100 flex items-center justify-between gap-2' },
            e('p', { className: 'text-xs font-black text-slate-800' }, title),
            note && e('span', { className: 'text-2xs font-bold text-rose-600 whitespace-nowrap' }, note)
          ),
          e('div', { className: 'p-3 text-xs leading-relaxed text-slate-700 space-y-2' }, body)
        );
      };
      const text = function(v) {
        return v && String(v).trim()
          ? e('p', { className: 'whitespace-pre-wrap' }, v)
          : e('p', { className: 'text-slate-400' }, '(작성하지 않음)');
      };
      const labeled = function(key, label, v) {
        return e('div', { key: key }, e('p', { className: 'font-bold mb-0.5 text-slate-800' }, label), text(v));
      };
      const roleKeys = ROLES.filter(function(r) { return act.roles && act.roles[r.key]; });
      const types = act.perfTypes || [];
      const peerNames = Object.keys(act.peerChecks || {});
      return e('div', { className: 'space-y-3' },
        box('1. 모둠 내 특별 활동 (해당자만)',
          roleKeys.length
            ? roleKeys.map(function(r) { return labeled(r.key, '[' + r.label + ']', (act.roleDetails || {})[r.key]); })
            : e('p', { className: 'text-slate-400' }, '특별 역할 없음')
        ),
        box('2. 개인 활동 내용',
          [e('p', { key: 'p' }, e('span', { className: 'font-bold' }, '공연 형태: '), perfTypeText(act) || '(선택하지 않음)')]
            .concat(types.map(function(t) {
              const d = (act.perfDetails || {})[t] || {};
              return e('div', { key: 't-' + t, className: 'p-2.5 rounded-lg bg-violet-50 border border-violet-100 space-y-1.5' },
                e('p', { className: 'font-black text-violet-800' }, perfTypeName(t, act)),
                labeled('w', '어떤 공연을 했는지', d.what),
                labeled('pr', '준비 과정', d.process)
              );
            }))
            .concat(REFLECT_FIELDS.map(function(f) { return labeled(f.key, f.label, act[f.key]); }))
        ),
        box('3. 모둠원 평가 (불참·불성실 모둠원)',
          peerNames.length || tlen(act.peerIssue)
            ? peerNames.map(function(n) { return labeled('pc-' + n, n, act.peerChecks[n]); })
                .concat(tlen(act.peerIssue) ? [labeled('pi', '직접 쓴 내용', act.peerIssue)] : [])
            : e('p', { className: 'text-slate-400' }, '해당 모둠원 없음'),
          props.forTeacher ? '선생님만 보는 내용' : '선생님만 봐요'),
        box('4. 다른 모둠 공연 평가',
          otherGroups(props.groupNo).map(function(g) {
            const ev = (act.evals || {})[String(g)] || {};
            const info = gi[groupKey(props.classNo, g)] || {};
            return e('div', { key: g, className: 'p-2.5 rounded-lg bg-slate-50 border border-slate-100 space-y-1.5' },
              e('div', { className: 'flex items-center justify-between gap-2 flex-wrap' },
                e('p', { className: 'font-bold text-slate-800' }, g + '조' + (info.title ? ' · ' + info.title : '')),
                e(Stars, { value: ev.stars || 0, readOnly: true, size: 'text-sm' })
              ),
              EVAL_FIELDS.map(function(f) { return labeled(f.key, f.label, ev[f.key]); })
            );
          }),
          props.forTeacher ? '선생님만 보는 내용' : '선생님만 봐요'
        )
      );
    }

    function App() {
      const [mainTab, setMainTab] = useState('activity');
      const [currentUser, setCurrentUser] = useState(function() {
        try {
          const savedUser = sessionStorage.getItem('perf_current_user');
          return savedUser ? JSON.parse(savedUser) : null;
        } catch(err) { return null; }
      });

      const [studentIdInput, setStudentIdInput] = useState('');
      const [studentPwInput, setStudentPwInput] = useState('');
      const [studentNameInput, setStudentNameInput] = useState('');
      const [registerClass, setRegisterClass] = useState('');
      const [registerGroup, setRegisterGroup] = useState('');
      // 등록 화면: 고른 반의 공연 제목·조원 이름만 (영상 링크는 받지 않음)
      const [regGroups, setRegGroups] = useState([]);
      const [isRegisterMode, setIsRegisterMode] = useState(false);
      const [authBusy, setAuthBusy] = useState(false);

      const [showTeacherModal, setShowTeacherModal] = useState(false);
      const [teacherIdInput, setTeacherIdInput] = useState('');
      const [teacherPwInput, setTeacherPwInput] = useState('');
      const [teacherAuth, setTeacherAuth] = useState(function() {
        try {
          const s = localStorage.getItem('perf_teacher_auth');
          return s ? JSON.parse(s) : { id: 'klidaum', pw: '123456' };
        } catch(err) { return { id: 'klidaum', pw: '123456' }; }
      });

      const [teacherSubTab, setTeacherSubTab] = useState('submissions');
      const [classFilter, setClassFilter] = useState('all');
      const [groupClass, setGroupClass] = useState(5);

      // [제출 마감] 서버에서 받은 마감 정보 (offset = 서버 시각 - 이 기기 시각)
      const [portal, setPortal] = useState(function() {
        try {
          const c = localStorage.getItem('perf_portal_status');
          if (c) { const o = JSON.parse(c); return { manual: !!o.manual, deadline: o.deadline || null, offset: o.offset || 0, serverClosed: false, known: true }; }
        } catch (err) {}
        return { manual: false, deadline: null, offset: 0, serverClosed: false, known: false };
      });
      const portalRef = useRef(portal);
      portalRef.current = portal;
      const [, setClockTick] = useState(0);
      const [showDeadlineModal, setShowDeadlineModal] = useState(false);
      const [deadlineInput, setDeadlineInput] = useState('');
      const [deadlinePw, setDeadlinePw] = useState('');
      const [deadlineBusy, setDeadlineBusy] = useState(false);
      const [showFinalPopup, setShowFinalPopup] = useState(false);
      const [studentCloudLoaded, setStudentCloudLoaded] = useState(0);
      const confirmLockHitRef = useRef(false);
      const [isCloudSyncing, setIsCloudSyncing] = useState(false);

      // 서버 상태: 'checking'(확인 중) / 'online'(정상) / 'offline'(응답 없음)
      const [serverStatus, setServerStatus] = useState(OFFLINE_MODE || !supabaseClient ? 'offline' : 'checking');
      const offlineRef = useRef(OFFLINE_MODE || !supabaseClient);
      const isOffline = OFFLINE_MODE || serverStatus === 'offline';
      const cloudReady = function() { return !!supabaseClient && !offlineRef.current; };
      const markOffline = function() {
        if (!offlineRef.current) {
          offlineRef.current = true;
          setServerStatus('offline');
        }
      };
      const markOnline = function() {
        offlineRef.current = false;
        setServerStatus('online');
      };
      const isPortalClosedNow = function(pOpt) {
        const pp = pOpt || portalRef.current;
        if (pp.manual || pp.serverClosed) return true;
        if (!pp.deadline) return false;
        return Date.now() + (pp.offset || 0) >= new Date(pp.deadline).getTime();
      };
      const applyPortal = function(np) {
        portalRef.current = np;
        setPortal(np);
        safeSetLocal('perf_portal_status', JSON.stringify({ manual: np.manual, deadline: np.deadline, offset: np.offset }));
      };
      const refreshPortalStatus = async function() {
        if (!cloudReady()) return null;
        try {
          const res = await withTimeout(supabaseClient.rpc('portal_status'), SERVER_CHECK_MS);
          if (res.error) {
            if (isNetworkFailure(res)) markOffline();
            return null;
          }
          const d = res.data || {};
          const np = {
            manual: !!d.manual,
            deadline: d.deadline || null,
            offset: d.now ? new Date(d.now).getTime() - Date.now() : 0,
            serverClosed: !!d.closed,
            known: true
          };
          applyPortal(np);
          return np;
        } catch (err) {
          if (isNetworkFailure(err)) markOffline();
          return null;
        }
      };
      const markPortalClosed = function() {
        applyPortal(Object.assign({}, portalRef.current, { serverClosed: true, known: true }));
      };
      const DEADLINE_MSG = '제출이 마감되어 더 이상 작성·수정·제출할 수 없습니다.';
      const CONFIRMED_MSG = '선생님이 점수를 확정해서 더 이상 활동 기록을 고칠 수 없습니다.';
      const lockMessage = function(reason) { return reason === 'confirmed' ? CONFIRMED_MSG : DEADLINE_MSG; };
      const lockReasonAfterFailedSync = function() {
        if (confirmLockHitRef.current) return 'confirmed';
        if (portalRef.current.serverClosed) return 'deadline';
        return null;
      };

      const SERVER_DOWN_MSG = '서버 응답이 없어 지금은 할 수 없습니다. 서버가 돌아오면(상단 표시가 정상으로 바뀌면) 다시 시도해 주세요.';

      const [allSubmissions, setAllSubmissions] = useState(function() {
        try {
          const s = localStorage.getItem('perf_submissions');
          return s ? JSON.parse(s) : {};
        } catch(err) { return {}; }
      });
      // 모둠 정보: 키 '반-조' → { title, video_url, members, plan_score, perform_score }
      const [groupInfo, setGroupInfo] = useState(function() {
        try {
          const s = localStorage.getItem('perf_group_info');
          return s ? JSON.parse(s) : {};
        } catch(err) { return {}; }
      });
      const groupInfoRef = useRef(groupInfo);
      groupInfoRef.current = groupInfo;
      const mergeGroupRows = function(rows) {
        if (!rows || !rows.length) return;
        // 바로 다음 줄의 계산에서도 최신 값을 쓰도록 ref를 먼저 바꾸고 화면 상태를 갱신
        const up = Object.assign({}, groupInfoRef.current);
        rows.forEach(function(r) {
          if (!r || r.class_no === undefined || r.group_no === undefined) return;
          const k = groupKey(r.class_no, r.group_no);
          const cur = Object.assign({}, up[k] || {});
          ['title', 'video_url', 'members', 'plan_score', 'perform_score'].forEach(function(f) {
            if (r[f] !== undefined) cur[f] = r[f];
          });
          up[k] = cur;
        });
        groupInfoRef.current = up;
        safeSetLocal('perf_group_info', JSON.stringify(up));
        setGroupInfo(up);
      };

      // 교사 채점 창
      const [gradingStudentId, setGradingStudentId] = useState(null);
      const [gradingForm, setGradingForm] = useState({ plan: '', perform: '', participation: '', review: '', comment: '', teacherFeedback: '' });
      const [gradingBusy, setGradingBusy] = useState(false);
      // 모둠 관리: 받은 평가 보기 창 { c, g }
      const [groupEvalViewer, setGroupEvalViewer] = useState(null);
      // 모둠 관리 입력값 (키 '반-조' → { title, video_url, members, plan, perform })
      const [groupDrafts, setGroupDrafts] = useState({});
      const [groupBusy, setGroupBusy] = useState('');

      const [newTeacherId, setNewTeacherId] = useState('');
      const [newTeacherPw, setNewTeacherPw] = useState('');
      const [currentTeacherPw, setCurrentTeacherPw] = useState('');
      const [toastMessage, setToastMessage] = useState('');

      const [editingStudentModal, setEditingStudentModal] = useState(false);
      const [editingStudentTargetId, setEditingStudentTargetId] = useState(null);
      const [editingStudentForm, setEditingStudentForm] = useState({ id: '', name: '', classNo: '', groupNo: '' });

      // 학생 작성 양식
      const [actForm, setActForm] = useState(function() { return Object.assign({ classNo: '', groupNo: '' }, emptyAct()); });
      const formDirtyRef = useRef(false);
      const [saveBusy, setSaveBusy] = useState(false);

      const toastTimerRef = useRef(null);
      const showToast = function(msg, ms) {
        setToastMessage(msg);
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(function() { setToastMessage(''); }, ms || 2600);
      };

      const currentUserRef = useRef(currentUser);
      currentUserRef.current = currentUser;

      const putLocalSub = function(id, data) {
        setAllSubmissions(function(prev) {
          const up = Object.assign({}, prev, { [id]: data });
          safeSetLocal('perf_submissions', JSON.stringify(up));
          return up;
        });
      };

      // =========================================================
      // [클라우드 연동]
      // =========================================================

      // 모둠 정보 불러오기
      //   교사: 모든 반, 점수까지 전부
      //   학생: 자기 반만 (공연 제목·영상·조원). 반이 아직 없으면 반을 고를 수 있게 제목·조원만 (영상 링크 없음)
      //   학생 기기에는 받아 온 것만 남기고 다른 반 정보는 지움
      const fetchGroupInfo = async function(u, classNo) {
        if (!cloudReady() || !u) return;
        try {
          if (u.role === 'teacher') {
            const res = await withTimeout(supabaseClient.from('group_info').select('class_no, group_no, title, video_url, members, plan_score, perform_score'));
            if (!res.error && res.data) mergeGroupRows(res.data);
            else if (isNetworkFailure(res)) markOffline();
            return;
          }
          const c = Number(classNo) || null;
          let query = supabaseClient.from('group_info').select(c ? 'class_no, group_no, title, video_url, members' : 'class_no, group_no, title, members');
          if (c) query = query.eq('class_no', c);
          const res = await withTimeout(query);
          if (!res.error && res.data) {
            const fresh = {};
            res.data.forEach(function(r) {
              if (c && Number(r.class_no) !== c) return;
              fresh[groupKey(r.class_no, r.group_no)] = { title: r.title || '', video_url: c ? (r.video_url || '') : '', members: r.members || '' };
            });
            groupInfoRef.current = fresh;
            safeSetLocal('perf_group_info', JSON.stringify(fresh));
            setGroupInfo(fresh);
          } else if (isNetworkFailure(res)) markOffline();
        } catch (err) {
          if (isNetworkFailure(err)) markOffline();
        }
      };

      // 학생: 자기 조의 모둠 점수만 확인
      const fetchMyGroupScores = async function(c, g) {
        if (!cloudReady() || !c || !g) return;
        try {
          const res = await withTimeout(supabaseClient.from('group_info').select('class_no, group_no, plan_score, perform_score').eq('class_no', Number(c)).eq('group_no', Number(g)).maybeSingle(), SERVER_CHECK_MS);
          if (!res.error) {
            mergeGroupRows([res.data || { class_no: Number(c), group_no: Number(g), plan_score: null, perform_score: null }]);
          } else if (isNetworkFailure(res)) markOffline();
        } catch (err) {
          if (isNetworkFailure(err)) markOffline();
        }
      };

      // 활동 기록 불러오기 (학생: 자기 것만 / 교사: 전체)
      const fetchSubmissionsFromCloud = async function(userOverride) {
        if (!cloudReady()) return;
        const u = (userOverride && userOverride.role) ? userOverride : currentUserRef.current;
        if (!u) return;
        try {
          if (u.role === 'teacher') { setIsCloudSyncing(true); fetchGroupInfo(u); }
          let query = supabaseClient.from('submissions').select('student_id, data');
          if (u.role === 'student') query = query.eq('student_id', String(u.id));
          const res = await withTimeout(query);
          if (!res.error && res.data) {
            const pending = getPendingSync();
            setAllSubmissions(function(prev) {
              const merged = u.role === 'teacher' ? {} : Object.assign({}, prev);
              if (u.role === 'teacher') {
                // 교사: 서버에 없는 학생(다른 곳에서 삭제됨)은 화면에서도 지움
                Object.keys(prev).forEach(function(id) { if (pending.indexOf(String(id)) !== -1) merged[id] = prev[id]; });
              }
              res.data.forEach(function(row) {
                if (row.student_id && row.data && pending.indexOf(String(row.student_id)) === -1) merged[row.student_id] = row.data;
              });
              safeSetLocal('perf_submissions', JSON.stringify(merged));
              return merged;
            });
            if (u.role === 'student') {
              const mine = res.data[0] && res.data[0].data;
              await fetchGroupInfo(u, mine && mine.classNo);
              if (mine && mine.classNo && mine.groupNo) await fetchMyGroupScores(mine.classNo, mine.groupNo);
              setStudentCloudLoaded(function(n) { return n + 1; });
            }
          } else if (isNetworkFailure(res)) {
            markOffline();
          }
        } catch (err) {
          console.error('Cloud Fetch Error:', err);
          if (isNetworkFailure(err)) markOffline();
        } finally {
          if (u.role === 'teacher') setIsCloudSyncing(false);
        }
      };

      const fetchOneFromCloud = async function(id) {
        if (!cloudReady() || !id) return;
        try {
          const res = await withTimeout(supabaseClient.from('submissions').select('student_id, data').eq('student_id', String(id)).maybeSingle());
          if (!res.error && res.data && res.data.data) putLocalSub(id, res.data.data);
        } catch (err) {
          console.error('Cloud Fetch One Error:', err);
        }
      };

      // 학생 한 명 기록 올리기 (성공하면 true). gradingOnly: 채점 저장용 표시(내용은 받은 그대로)
      const syncStudentToCloud = async function(studentId, submissionData) {
        if (!cloudReady() || !studentId) return false;
        confirmLockHitRef.current = false;
        try {
          const res = await withTimeout(supabaseClient
            .from('submissions')
            .upsert({
              student_id: String(studentId),
              data: submissionData,
              updated_at: new Date().toISOString()
            }, { onConflict: 'student_id' }));
          if (res.error) {
            console.error('Cloud Sync Error:', res.error);
            if (isNetworkFailure(res)) markOffline();
            if (isDeadlineError(res)) markPortalClosed();
            if (isConfirmedLockError(res)) confirmLockHitRef.current = true;
            return false;
          }
          return true;
        } catch (err) {
          console.error('Cloud Sync Error:', err);
          if (isNetworkFailure(err)) markOffline();
          return false;
        }
      };

      // 학생 기기: 1분마다 내 채점 결과 + 우리 조 모둠 점수만 확인 (작은 요청)
      const checkMyGrading = async function(u) {
        if (!cloudReady() || !u || u.role !== 'student') return;
        try {
          const res = await withTimeout(supabaseClient.from('submissions').select('grading:data->grading, classNo:data->classNo, groupNo:data->groupNo').eq('student_id', String(u.id)).maybeSingle(), SERVER_CHECK_MS);
          if (res.error || !res.data) {
            if (isNetworkFailure(res)) markOffline();
            return undefined;
          }
          const g = res.data.grading || null;
          const sc = res.data.classNo || null, sg = res.data.groupNo || null;
          const before = loadLocalSubmissions()[u.id] || {};
          const placeChanged = (sc || sg) && (Number(before.classNo || 0) !== Number(sc || 0) || Number(before.groupNo || 0) !== Number(sg || 0));
          setAllSubmissions(function(prev) {
            const mine = prev[u.id];
            if (!mine) return prev;
            const sameGrade = JSON.stringify(mine.grading || null) === JSON.stringify(g);
            const samePlace = !(sc || sg) || (Number(mine.classNo || 0) === Number(sc || 0) && Number(mine.groupNo || 0) === Number(sg || 0));
            if (sameGrade && samePlace) return prev;
            const patch = { grading: g || undefined };
            // 선생님이 반·조를 바꾸면 학생 화면에도 반영
            if (!samePlace) { patch.classNo = sc || undefined; patch.groupNo = sg || undefined; }
            const up = Object.assign({}, prev, { [u.id]: Object.assign({}, mine, patch) });
            safeSetLocal('perf_submissions', JSON.stringify(up));
            return up;
          });
          if (placeChanged && sc) await fetchGroupInfo(u, sc);
          if (res.data.classNo && res.data.groupNo) await fetchMyGroupScores(res.data.classNo, res.data.groupNo);
          return g;
        } catch (err) {
          if (isNetworkFailure(err)) markOffline();
          return undefined;
        }
      };

      // 이 기기에 쌓여 있던(아직 전달하지 못한) 기록을 클라우드로 올리기 (채점 결과는 서버 것 유지)
      const pushPendingForStudent = async function(id) {
        if (!cloudReady() || getPendingSync().indexOf(String(id)) === -1) return;
        const local = loadLocalSubmissions()[id];
        if (!local) { removePendingSync(id); return; }
        try {
          const res = await withTimeout(supabaseClient.from('submissions').select('data').eq('student_id', String(id)).maybeSingle());
          if (res.error) return;
          const cloud = (res.data && res.data.data) || {};
          const merged = Object.assign({}, cloud, local, {
            reports: Object.assign({}, cloud.reports || {}, local.reports || {})
          });
          if (cloud.grading) merged.grading = cloud.grading; else delete merged.grading;
          const ok = await syncStudentToCloud(id, merged);
          if (ok) {
            removePendingSync(id);
            putLocalSub(id, merged);
            showToast('이 기기에 저장해 둔 활동 기록을 선생님께 전달했습니다. ☁️', 5000);
          } else if (lockReasonAfterFailedSync()) {
            const why = lockReasonAfterFailedSync();
            removePendingSync(id);
            formDirtyRef.current = false;
            fetchSubmissionsFromCloud({ role: 'student', id: id });
            showToast((why === 'confirmed' ? '점수가 확정된 뒤라' : '제출 마감 이후라') + ' 이 기기에만 저장되어 있던 내용은 전달되지 않았습니다.', 7000);
          }
        } catch (err) {
          console.error('Pending Push Error:', err);
        }
      };

      // 서버가 살아 있는지 짧게 확인 (8초 안에 답이 없으면 오프라인으로 전환)
      const serverStatusShownRef = useRef(serverStatus);
      serverStatusShownRef.current = serverStatus;
      const checkServer = async function() {
        if (OFFLINE_MODE || !supabaseClient) return false;
        try {
          const res = await withTimeout(supabaseClient.from('students').select('student_id').limit(1), SERVER_CHECK_MS);
          if (isNetworkFailure(res)) { markOffline(); return false; }
          const wasOffline = offlineRef.current;
          markOnline();
          if (wasOffline && serverStatusShownRef.current === 'offline') {
            showToast('서버가 다시 연결되었습니다. ☁️');
          }
          return true;
        } catch (err) {
          markOffline();
          return false;
        }
      };

      // 1분마다 작은 확인: 서버 상태 + 마감 정보 + (학생) 계정·채점 결과. 전체 기록은 처음·재연결 때만
      const firstTickDoneRef = useRef(false);
      useEffect(function() {
        if (OFFLINE_MODE || !supabaseClient) return;
        const tick = async function() {
          const wasOffline = offlineRef.current;
          const ok = await checkServer();
          if (!ok) return;
          await refreshPortalStatus();
          const u = currentUserRef.current;
          const needFullFetch = !firstTickDoneRef.current || wasOffline;
          firstTickDoneRef.current = true;
          if (!u) return;
          verifyStudentStillExists(u);
          if (needFullFetch) fetchSubmissionsFromCloud(u);
          else checkMyGrading(u);
        };
        tick();
        const interval = setInterval(tick, 60000);
        return function() { clearInterval(interval); };
      }, []);

      // 마감 시각이 지나는 순간 화면이 바로 바뀌도록 10초마다 다시 그림 (서버 요청 없음)
      useEffect(function() {
        const t = setInterval(function() { setClockTick(function(n) { return n + 1; }); }, 10000);
        return function() { clearInterval(t); };
      }, []);

      // [실시간] 교사: 학생 기록이 바뀌면 그 학생 것만 반영 / 학생: 계정 삭제만 감시
      const liveKey = currentUser ? currentUser.role + ':' + currentUser.id : '';
      useEffect(function() {
        if (!supabaseClient || !currentUser || serverStatus !== 'online') return;
        const isStudent = currentUser.role === 'student';
        let channel = null;
        try {
          channel = supabaseClient.channel('live-' + liveKey);
          if (!isStudent) channel = channel
            .on('postgres_changes', { event: '*', schema: 'public', table: 'submissions' }, function(payload) {
              if (payload.eventType === 'DELETE') {
                const delId = payload.old && payload.old.student_id;
                if (delId) {
                  setAllSubmissions(function(prev) {
                    if (!prev[delId]) return prev;
                    const up = Object.assign({}, prev);
                    delete up[delId];
                    safeSetLocal('perf_submissions', JSON.stringify(up));
                    return up;
                  });
                }
                return;
              }
              const row = payload.new || {};
              if (!row.student_id) return;
              if (row.data) putLocalSub(row.student_id, row.data);
              else fetchOneFromCloud(row.student_id);
            });
          if (isStudent) {
            channel = channel.on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'students' }, function() {
              verifyStudentStillExists(currentUserRef.current);
            });
          }
          channel.subscribe();
        } catch (err) {
          console.error('Realtime Subscribe Error:', err);
        }
        return function() {
          if (channel) supabaseClient.removeChannel(channel);
        };
      }, [liveKey, serverStatus]);

      // 학생 화면: 채점 결과가 새로 들어오면 알림
      const lastGradedRef = useRef(null);
      useEffect(function() {
        if (!currentUser || currentUser.role !== 'student') { lastGradedRef.current = null; return; }
        const mine = allSubmissions[currentUser.id];
        const stamp = (mine && mine.grading && mine.grading.gradedAt) || '';
        if (lastGradedRef.current !== null && stamp && stamp !== lastGradedRef.current) {
          showToast('선생님이 채점했습니다. 화면 위쪽 점수표에서 확인하세요. 📝', 5000);
        }
        lastGradedRef.current = stamp;
      }, [allSubmissions, currentUser]);

      const updateCurrentUserSession = function(user) {
        setCurrentUser(user);
        currentUserRef.current = user;
        try {
          if (user) sessionStorage.setItem('perf_current_user', JSON.stringify(user));
          else sessionStorage.removeItem('perf_current_user');
        } catch (err) {}
      };

      // =========================================================
      // [학생 계정] Supabase 'students' 표
      // =========================================================
      const getStudentAccounts = function() {
        try {
          const s = localStorage.getItem('perf_student_accounts');
          return s ? JSON.parse(s) : {};
        } catch(err) { return {}; }
      };

      const cacheLocalAccount = function(id, name, pw) {
        const accs = getStudentAccounts();
        accs[id] = { id: id, name: name, pw: pw };
        safeSetLocal('perf_student_accounts', JSON.stringify(accs));
      };

      const ACCOUNT_STORE_ERROR = '학생 계정 저장소(students 표)에 연결할 수 없습니다. 잠시 후 다시 시도하고, 계속되면 선생님께 알려 주세요.';

      const cloudGetAccount = function(id) {
        return withTimeout(supabaseClient.from('students').select('*').eq('student_id', String(id)).maybeSingle(), SERVER_CHECK_MS);
      };

      const showAccountError = function(err) {
        if (err && err.message === 'TIMEOUT') {
          showToast('클라우드 응답이 없습니다. 서버 점검 중일 수 있으니 잠시 후 다시 시도해 주세요.', 6000);
          return;
        }
        const detail = err && (err.message || err.code) ? ' (' + (err.code ? err.code + ': ' : '') + (err.message || '') + ')' : '';
        showToast(ACCOUNT_STORE_ERROR + detail, 7000);
      };

      const purgeLocalStudent = function(id) {
        removePendingSync(id);
        const accs = getStudentAccounts();
        if (accs[id]) {
          delete accs[id];
          safeSetLocal('perf_student_accounts', JSON.stringify(accs));
        }
        setAllSubmissions(function(prev) {
          if (!prev[id]) return prev;
          const up = Object.assign({}, prev);
          delete up[id];
          safeSetLocal('perf_submissions', JSON.stringify(up));
          return up;
        });
      };

      // 오프라인 때 이 기기에서 만든 계정을 서버로 옮기기 (이 기기에 쓴 기록이 아직 전달 전일 때만)
      const migrateLegacyAccount = async function(id) {
        const local = getStudentAccounts()[id];
        if (!local) return null;
        if (getPendingSync().indexOf(String(id)) === -1) {
          const subRes = await withTimeout(supabaseClient.from('submissions').select('student_id').eq('student_id', String(id)).maybeSingle());
          if (subRes.error || !subRes.data) return null;
        }
        const acc = { student_id: String(id), name: local.name, pw: local.pw };
        const ins = await withTimeout(supabaseClient.from('students').upsert(acc, { onConflict: 'student_id' }));
        return ins.error ? null : acc;
